                        <td style={s.td}>{f.transportadora}</td>
                        <td style={{...s.td,fontSize:11}}>{f.destino||"—"}</td>
                        <td style={s.td}>{fmtBRL(f.valorNF)}</td>
                        <td style={{...s.td,color:f.valorFrete>f.orcamento&&f.orcamento>0?"#f87171":"#4ade80",fontWeight:600}}>{fmtBRL(f.valorFrete)}</td>
                        <td style={{...s.td,color:"#94a3b8"}}>{pct}{pct!=="—"&&"%"}</td>
                        <td style={s.td}><span style={{padding:"2px 7px",borderRadius:99,fontSize:10,background:({entregue:"#22c55e",em_transito:"#f59e0b",pendente:"#3b82f6",cancelado:"#ef4444"})[f.status]+"22",color:({entregue:"#22c55e",em_transito:"#f59e0b",pendente:"#3b82f6",cancelado:"#ef4444"})[f.status]}}>{({entregue:"Entregue",em_transito:"Em Trânsito",pendente:"Pendente",cancelado:"Cancelado"})[f.status]||f.status}</span></td>
                        <td style={s.td}>{fmtDate(f.prazo)}</td>
                        <td style={{...s.td,color:atrasado?"#f87171":"#cbd5e1"}}>{fmtDate(f.entrega)}{atrasado&&" ⚠️"}</td>
                        <td style={{...s.td,fontSize:10,color:"#94a3b8"}}>{(f.rateios||[]).map((r,i)=><span key={i} style={{display:"block"}}>{ccNome(r.ccId)} {r.pct}%</span>)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

    },
    nfeio: {
      nome:"NFe.io", logo:"📋", cor:"#8b5cf6",
      site:"https://nfe.io",
      docs:"https://nfe.io/consulta-nota-fiscal/",
      campos:[
        {key:"api_key",    label:"API Key",        tipo:"password", placeholder:"Chave de API NFe.io"},

        {key:"cnpj",       label:"CNPJ da Oáz",   tipo:"text",     placeholder:"00.000.000/0001-00"},
        {key:"cert_a1",    label:"Certificado A1 (base64)", tipo:"password", placeholder:"Conteúdo base64 do .pfx"},
        {key:"cert_senha", label:"Senha do Certificado",    tipo:"password", placeholder:"Senha do certificado digital"},

      docs:"https://focusnfe.com.br/documentacao",
      campos:[
        {key:"api_key",    label:"Token de Acesso", tipo:"password", placeholder:"Token da API Focus NFe"},
        {key:"cnpj",       label:"CNPJ da Oáz",    tipo:"text",     placeholder:"00.000.000/0001-00"},
        {key:"cert_a1",    label:"Certificado A1 (base64)", tipo:"password", placeholder:"Conteúdo base64 do .pfx"},
        {key:"cert_senha", label:"Senha do Certificado",    tipo:"password", placeholder:"Senha do certificado digital"},
      ],
      endpoints:{
        recebidas:"https://api.focusnfe.com.br/v2/nfes_recebidas",

  /* Simula busca — quando API real estiver disponível, substituir pelo fetch */
  async function buscarNFs() {
    const plat = PLATAFORMAS[abaCfg];
    const cfg  = config[abaCfg] || {};
    setBuscando(true);
    setResultado(null);
    setNfsSel([]);
    setLog([]);

    } catch(e) {
      addLog("❌ Erro na conexão: " + e.message, "erro");
    }
    setBuscando(false);
  }

  /* Importa NFs selecionadas para o Torre de Controle */
  /* ── Verifica duplicidade e abre modal de crítica ─────────────────────── */
  async function importarSelecionadas() {
    if (!nfsSel.length) { alert("Selecione ao menos uma NF para importar."); return; }

    const novas       = [];
    const duplicadas  = [];

    nfsSel.forEach(nf => {
      // Verifica por chave NF-e (mais confiável) OU por CNPJ + número
      const dupChave  = nf.chave  && fretes.some(f => f.chaveNFe === nf.chave);
      const dupNumero = nf.numero && fretes.some(f =>
        f.nf === String(nf.numero) &&
        (nf.cnpjEmitente ? f.cnpjEmitente === nf.cnpjEmitente : true)
      );

      const freteDup = fretes.find(f =>
        (nf.chave && f.chaveNFe === nf.chave) ||
        (nf.numero && f.nf === String(nf.numero))
      );

      if (dupChave || dupNumero) {
        duplicadas.push({ nf, freteDup, motivo: dupChave ? "Chave NF-e idêntica" : "Número + CNPJ já existem na base" });
      } else {
        novas.push(nf);
      }
    });

    // Se não há duplicadas, importa direto
    if (!duplicadas.length) {
      await executarImportacao(novas, []);
      return;
    }

    // Se há duplicadas, abre modal de crítica
    setAnalise({ novas, duplicadas, pendente: duplicadas.map(d => ({ ...d, acao: "ignorar" })) });
    setModalDup(true);
  }

  /* Atualiza ação de cada duplicada no modal */
  function setAcaoDup(idx, acao) {
    setAnalise(prev => {
      const pendente = [...prev.pendente];
      pendente[idx] = { ...pendente[idx], acao };
      return { ...prev, pendente };
    });
  }

  /* Confirma importação após decisão no modal */
  async function confirmarImportacao() {
    setModalDup(false);
    setImportando(true);

    const substituir = analise.pendente.filter(d => d.acao === "substituir").map(d => d.nf);
    const ignoradas  = analise.pendente.filter(d => d.acao === "ignorar").map(d => d.nf);
    const todas      = [...analise.novas, ...substituir];

    addLog(`📥 Importando ${analise.novas.length} NFs novas...`);
    if (substituir.length) addLog(`🔄 Substituindo ${substituir.length} NFs duplicadas conforme escolha...`);
    if (ignoradas.length)  addLog(`⏭️ Ignorando ${ignoradas.length} NFs duplicadas conforme escolha...`);

    await executarImportacao(todas, substituir);
    setImportando(false);
    setNfsSel([]);
  }

  /* Executa a importação de fato */
  async function executarImportacao(nfsParaImportar, substituicoes) {
    setImportando(true);
    const novos = nfsParaImportar.map(nf => ({
      id: "nf_" + Date.now() + Math.random(),
      nf: nf.numero, tipo: nf.tipo === "emitida" ? "emitida" : "recebida",
      transportadora: nf.transportadora || "Não informada",
      modalidade: nf.modalidade,
      origem: nf.origem, destino: nf.destino,
      valorNF: nf.valorNF, valorFrete: nf.valorFrete,
      peso: nf.peso || 0, orcamento: 0,
      prazo: "", entrega: "", status: "pendente",
      mes: nf.dataEmissao?.slice(0, 7) || new Date().toISOString().slice(0, 7),
      chaveNFe: nf.chave, chaveCTe: null, rateios: [],
      _substituicao: substituicoes.includes(nf),
    }));
    onImportar(novos);
    await new Promise(r => setTimeout(r, 600));
    const total    = novos.length;
    const subst    = novos.filter(n => n._substituicao).length;
    const reais    = total - subst;
    addLog(`✅ Importação concluída! ${reais} novas + ${subst} substituídas.`, "ok");
    alert(`✅ Importação concluída!\n\n📄 ${reais} NFs novas adicionadas\n🔄 ${subst} NFs substituídas`);
    setImportando(false);
  }

  const cfgAtual = config[abaCfg] || {};

  const temApiKey = !!cfgAtual.api_key;
  const temCnpj   = !!cfgAtual.cnpj;
  const temCert   = !!cfgAtual.cert_a1;

              Busca <strong style={{color:"#3b82f6"}}>NFs emitidas com frete CIF</strong> (Oáz paga o frete)
              e <strong style={{color:"#8b5cf6"}}>NFs recebidas com frete FOB</strong> (fornecedor paga o frete) — filtra automaticamente pelo modal de frete do XML.
            </p>
          </div>
          {/* Status geral */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,minWidth:240}}>
            {[
              {label:"API Key",    ok:temApiKey, icon:"🔑"},
              {label:"CNPJ",       ok:temCnpj,   icon:"🏢"},
              {label:"Cert. A1",   ok:temCert,   icon:"📜"},
            ].map((item,i)=>(
              <div key={i} style={{background:"#0b1623",borderRadius:8,padding:"8px 10px",textAlign:"center",border:`1px solid ${item.ok?"#166534":"#334155"}`}}>
                <div style={{fontSize:16}}>{item.icon}</div>
                <div style={{fontSize:10,color:item.ok?"#4ade80":"#f87171",fontWeight:600,marginTop:2}}>{item.ok?"✅ OK":"⏳ Pendente"}</div>
                <div style={{fontSize:9,color:"#475569"}}>{item.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Seleção de plataforma */}
      <div style={s.card}>
        <h3 style={s.cardTitle}>🌐 Plataforma de Consulta SEFAZ</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginTop:12}}>
          {Object.entries(PLATAFORMAS).map(([key,plat])=>(
            <div key={key}
              onClick={()=>setAbaCfg(key)}
              style={{background:abaCfg===key?"#0d1f35":"#0b1623",border:`2px solid ${abaCfg===key?plat.cor:"#1e293b"}`,borderRadius:10,padding:14,cursor:"pointer",transition:"all .2s",position:"relative"}}>
              {plat.recomendado && <span style={{position:"absolute",top:8,right:8,background:"#166534",color:"#4ade80",fontSize:9,padding:"2px 6px",borderRadius:99,fontWeight:700}}>⭐ RECOMENDADO</span>}
              <div style={{fontSize:24}}>{plat.logo}</div>
              <div style={{fontWeight:700,color:"#f8fafc",fontSize:13,marginTop:6}}>{plat.nome}</div>
              <div style={{fontSize:11,color:"#64748b",marginTop:4,lineHeight:1.5}}>{plat.descricao}</div>

                style={{display:"inline-block",marginTop:8,fontSize:10,color:plat.cor,textDecoration:"none"}}>

                  {campo.label}
                  {campo.key==="cert_a1" && <span style={{color:"#f59e0b",marginLeft:6,fontSize:10}}>⚠️ Necessário para consulta na SEFAZ</span>}
                </label>
                <div style={{position:"relative"}}>
                  <input
                    style={{...s.input, paddingRight:campo.tipo==="password"?"36px":"10px",
                      borderColor: campo.key==="cert_a1"&&!cfgAtual.cert_a1?"#78350f":"#334155",
                      background:  campo.key==="cert_a1"&&!cfgAtual.cert_a1?"#1a0f00":"#1e293b"}}
                    type={campo.tipo==="password"&&!mostrarSenha[campo.key]?"password":"text"}
                    placeholder={campo.placeholder}
                    value={cfgAtual[campo.key]||""}
                    onChange={e=>salvarConfig(abaCfg, campo.key, e.target.value)}
                  />
                  {campo.tipo==="password"&&(
                    <button style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:13}}
                      onClick={()=>setMostrarSenha(p=>({...p,[campo.key]:!p[campo.key]}))}>
                      {mostrarSenha[campo.key]?"🙈":"👁️"}
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          {/* Aviso certificado */}
          {!temCert && (
            <div style={{marginTop:14,background:"#1a0f00",border:"1px solid #78350f",borderRadius:8,padding:12}}>
              <div style={{fontWeight:700,color:"#fbbf24",fontSize:12,marginBottom:6}}>📜 Como obter o Certificado Digital A1</div>
              {["Peça ao contador ou TI da Oáz o arquivo .pfx (certificado A1)",
                "Converta para base64: abra o terminal e execute: base64 -i certificado.pfx",
                "Cole o resultado no campo 'Certificado A1' acima",
                "Informe a senha do certificado no campo correspondente",
                "Salve e execute a busca — pronto!"
              ].map((p,i)=>(
                <div key={i} style={{display:"flex",gap:8,marginBottom:4,alignItems:"flex-start"}}>
                  <span style={{minWidth:16,height:16,borderRadius:"50%",background:"#78350f",color:"#fbbf24",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",marginTop:1}}>{i+1}</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>{p}</span>
                </div>
              ))}
            </div>
          )}

          <button style={{...s.btnSecondary,width:"100%",marginTop:12,fontSize:12,color:"#22c55e",borderColor:"#166534"}}
            onClick={()=>{try{localStorage.setItem("oaz_sefaz_config",JSON.stringify(config));alert("✅ Credenciais salvas com sucesso!");}catch(e){alert("Erro ao salvar: "+e.message);}}}>
            💾 Salvar Credenciais
          </button>
        </div>

        {/* Painel de busca */}
        <div style={{display:"flex",flexDirection:"column",gap:14}}>

          {/* Filtros de busca */}
          <div style={s.card}>
            <h3 style={s.cardTitle}>⚙️ Parâmetros da Busca</h3>
            <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:12}}>

              <div>
                <label style={s.label}>Tipo de NF a buscar</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {[
                    {id:"cif_emitida",  label:"📤 NFs Emitidas — CIF",  sub:"Oáz emite, frete por conta da Oáz", cor:"#3b82f6"},
                    {id:"fob_recebida", label:"📥 NFs Recebidas — FOB", sub:"Fornecedor emite, frete por conta dele", cor:"#8b5cf6"},
                    {id:"ambos",        label:"🔄 Buscar Ambos",        sub:"CIF emitidas + FOB recebidas", cor:"#22c55e"},
                    {id:"todas",        label:"📋 Todas as NFs",        sub:"Sem filtro de modalidade de frete", cor:"#f59e0b"},
                  ].map(opt=>(
                    <div key={opt.id} onClick={()=>setFiltroModal(opt.id)}
                      style={{background:filtroModal===opt.id?"#0d1f35":"#0b1623",border:`2px solid ${filtroModal===opt.id?opt.cor:"#1e293b"}`,borderRadius:8,padding:10,cursor:"pointer"}}>
                      <div style={{fontSize:12,fontWeight:600,color:filtroModal===opt.id?opt.cor:"#94a3b8"}}>{opt.label}</div>
                      <div style={{fontSize:10,color:"#475569",marginTop:2}}>{opt.sub}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><label style={s.label}>Data Início</label><input style={s.input} type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div>
                <div><label style={s.label}>Data Fim</label><input style={s.input} type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div>
              </div>

              <button
                style={{...s.btnPrimary,width:"100%",fontSize:13,opacity:buscando?0.7:1,
                  background:temCert?"linear-gradient(135deg,#3b82f6,#2563eb)":"linear-gradient(135deg,#78350f,#92400e)"}}
                disabled={buscando}
                onClick={buscarNFs}>
                {buscando ? "⏳ Buscando na SEFAZ..." : temCert ? "🔍 Buscar NFs na SEFAZ" : "⚠️ Configurar Certificado A1 para Buscar"}
              </button>

              {!temCert&&(
                <div style={{background:"#0b1623",borderRadius:8,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:11,color:"#f59e0b"}}>⏳ Módulo pronto — aguardando Certificado Digital A1</div>
                  <div style={{fontSize:10,color:"#475569",marginTop:2}}>Assim que inserir o certificado, clique em Buscar e as NFs serão carregadas automaticamente.</div>
                </div>
              )}
            </div>
          </div>

          {/* Log de execução */}
          {log.length>0&&(
            <div style={s.card}>
              <h3 style={s.cardTitle}>📋 Log de Execução</h3>
              <div style={{marginTop:8,maxHeight:160,overflowY:"auto",fontFamily:"monospace",fontSize:11}}>
                {log.map((l,i)=>(
                  <div key={i} style={{display:"flex",gap:8,padding:"3px 0",borderBottom:"1px solid #0f172a",color:l.tipo==="erro"?"#f87171":l.tipo==="ok"?"#4ade80":l.tipo==="aviso"?"#fbbf24":"#64748b"}}>
                    <span style={{color:"#334155",minWidth:60}}>{l.hora}</span>
                    <span>{l.msg}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Resultado da busca */}
      {resultado&&resultado.length>0&&(
        <div style={s.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3 style={s.cardTitle}>📦 NFs Encontradas ({resultado.length})</h3>
            <div style={{display:"flex",gap:8}}>
              <button style={{...s.btnSecondary,fontSize:12}} onClick={()=>setNfsSel(resultado.map(n=>n))}>Selecionar Tudo</button>
              <button style={{...s.btnSecondary,fontSize:12}} onClick={()=>setNfsSel([])}>Limpar Seleção</button>
              <button style={{...s.btnPrimary,fontSize:12}} disabled={!nfsSel.length||importando} onClick={importarSelecionadas}>
                {importando?"⏳ Importando...":"📥 Importar Selecionadas ("+nfsSel.length+")"}
              </button>
            </div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={s.table}>
              <thead><tr>{["","Chave NF-e","Número","Emissão","Tipo","Modalidade","Remetente/Destinatário","Valor NF","Valor Frete","Status"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
              <tbody>
                {resultado.map((nf,i)=>{
                  const sel = nfsSel.includes(nf);
                  return(
                    <tr key={i} style={{...s.tr,background:sel?"#0d1f35":"transparent",cursor:"pointer"}} onClick={()=>setNfsSel(prev=>sel?prev.filter(n=>n!==nf):[...prev,nf])}>
                      <td style={s.td}><input type="checkbox" checked={sel} onChange={()=>{}} style={{cursor:"pointer"}}/></td>
                      <td style={{...s.td,fontSize:10,color:"#475569",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis"}}>{nf.chave||"—"}</td>
                      <td style={{...s.td,fontWeight:600,color:"#93c5fd"}}>{nf.numero}</td>
                      <td style={s.td}>{fmtDate(nf.dataEmissao)}</td>
                      <td style={s.td}><span style={{padding:"2px 7px",borderRadius:99,fontSize:10,background:nf.tipo==="emitida"?"#1e3a5f":"#2d1b4e",color:nf.tipo==="emitida"?"#93c5fd":"#c4b5fd"}}>{nf.tipo==="emitida"?"↑ Emitida":"↓ Recebida"}</span></td>
                      <td style={s.td}><span style={{padding:"2px 7px",borderRadius:99,fontSize:10,background:nf.modalidade==="CIF"?"#1e3a5f":"#2d1b4e",color:nf.modalidade==="CIF"?"#60a5fa":"#a78bfa",fontWeight:600}}>{nf.modalidade}</span></td>
                      <td style={{...s.td,fontSize:11}}>{nf.parceiro||"—"}</td>
                      <td style={s.td}>{fmtBRL(nf.valorNF)}</td>
                      <td style={{...s.td,color:"#4ade80",fontWeight:600}}>{fmtBRL(nf.valorFrete)}</td>
                      <td style={s.td}><span style={{padding:"2px 7px",borderRadius:99,fontSize:10,background:"#22c55e22",color:"#22c55e"}}>{nf.situacao||"Autorizada"}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Guia completo */}
      <div style={s.card}>
        <h3 style={s.cardTitle}>📖 Como ativar a Busca Automática — Passo a Passo</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginTop:14}}>
          {[
            {n:"1",icon:"🌐",titulo:"Criar conta",desc:"Acesse espiaonfe.com.br e crie sua conta. Teste grátis por 7 dias, sem cartão."},
            {n:"2",icon:"🔑",titulo:"Gerar API Key",desc:"No painel do Espião NF-e, vá em Configurações → API → Gerar nova chave de acesso."},
            {n:"3",icon:"📜",titulo:"Obter Cert. A1",desc:"Peça ao contador o arquivo .pfx do CNPJ da Oáz. Converta para base64 (instruções no painel acima)."},
            {n:"4",icon:"⚙️",titulo:"Configurar aqui",desc:"Cole a API Key, CNPJ, certificado A1 e senha nos campos acima. Clique em Salvar Credenciais."},
            {n:"5",icon:"🚀",titulo:"Buscar NFs",desc:"Selecione o período e tipo (CIF/FOB), clique em Buscar. As NFs aparecem e você importa para o Torre de Controle."},
          ].map((p,i)=>(
            <div key={i} style={{background:"#0b1623",borderRadius:8,padding:12,textAlign:"center",borderTop:"3px solid #3b82f6"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"#1e3a5f",color:"#93c5fd",fontWeight:700,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 8px"}}>{p.n}</div>
              <div style={{fontSize:22}}>{p.icon}</div>
              <div style={{fontWeight:700,color:"#f8fafc",fontSize:12,marginTop:6}}>{p.titulo}</div>
              <div style={{fontSize:10,color:"#64748b",marginTop:4,lineHeight:1.5}}>{p.desc}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:14,background:"#0b1623",borderRadius:8,padding:12,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{fontSize:24}}>💡</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:"#fbbf24",fontSize:12}}>Como funciona o filtro CIF × FOB automaticamente</div>
            <div style={{fontSize:11,color:"#64748b",marginTop:4,lineHeight:1.6}}>
              O XML da NF-e tem o campo <code style={{background:"#1e293b",padding:"1px 4px",borderRadius:3,color:"#93c5fd"}}>modFrete</code> que indica:
              <strong style={{color:"#3b82f6"}}> 0 = CIF</strong> (emitente paga o frete) e
              <strong style={{color:"#8b5cf6"}}> 1 = FOB</strong> (destinatário paga o frete).
              O sistema lê esse campo automaticamente e separa as NFs nos dois grupos.
            </div>
          </div>
        </div>
      </div>

      {/* ── Modal de Crítica de Duplicidade ─────────────────────────────────── */}
      {modalDup && (
        <div style={s.overlay}>
          <div style={{...s.modal, maxWidth:780, maxHeight:"90vh", overflow:"auto"}}>

            {/* Cabeçalho */}
            <div style={{...s.modalHeader, borderBottom:"1px solid #1e293b", paddingBottom:16}}>
              <div>
                <h2 style={{color:"#f8fafc", fontSize:16, margin:0}}>⚠️ Notas Fiscais Duplicadas Encontradas</h2>
                <p style={{color:"#64748b", fontSize:12, marginTop:4}}>
                  Revise cada NF duplicada e decida se deseja <strong style={{color:"#4ade80"}}>ignorar</strong> ou <strong style={{color:"#f59e0b"}}>substituir</strong> na base.
                </p>
              </div>
              <button style={s.closeBtn} onClick={()=>setModalDup(false)}>✕</button>
            </div>

            {/* Resumo */}
            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, margin:"16px 0"}}>
              {[
                {icon:"✅", label:"NFs Novas", val:analise.novas.length, cor:"#22c55e", desc:"Serão importadas automaticamente"},
                {icon:"⚠️", label:"Duplicadas", val:analise.duplicadas.length, cor:"#f59e0b", desc:"Aguardam sua decisão abaixo"},
                {icon:"📋", label:"Total Selecionadas", val:nfsSel.length, cor:"#3b82f6", desc:"NFs selecionadas para importar"},
              ].map((k,i)=>(
                <div key={i} style={{background:"#0b1623", borderRadius:8, padding:12, textAlign:"center", borderTop:`3px solid ${k.cor}`}}>
                  <div style={{fontSize:22}}>{k.icon}</div>
                  <div style={{fontSize:22, fontWeight:700, color:k.cor, marginTop:4}}>{k.val}</div>
                  <div style={{fontSize:11, color:"#f8fafc", fontWeight:600}}>{k.label}</div>
                  <div style={{fontSize:10, color:"#475569", marginTop:2}}>{k.desc}</div>
                </div>
              ))}
            </div>

            {/* Ações globais */}
            <div style={{display:"flex", gap:8, marginBottom:14}}>
              <button style={{...s.btnSecondary, fontSize:11, flex:1, color:"#4ade80", borderColor:"#166534"}}
                onClick={()=>setAnalise(prev=>({...prev, pendente:prev.pendente.map(d=>({...d, acao:"ignorar"}))}))}>
                ⏭️ Ignorar Todas as Duplicadas
              </button>
              <button style={{...s.btnSecondary, fontSize:11, flex:1, color:"#f59e0b", borderColor:"#92400e"}}
                onClick={()=>setAnalise(prev=>({...prev, pendente:prev.pendente.map(d=>({...d, acao:"substituir"}))}))}>
                🔄 Substituir Todas as Duplicadas
              </button>
            </div>

            {/* Lista de duplicadas */}
            <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:16}}>
              {analise.pendente.map((dup, idx)=>(
                <div key={idx} style={{background:"#0b1623", borderRadius:10, padding:14, border:`1px solid ${dup.acao==="substituir"?"#92400e":"#1e293b"}`}}>
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8}}>

                    {/* Info da NF */}
                    <div style={{flex:1}}>
                      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:6}}>
                        <span style={{fontWeight:700, color:"#f59e0b", fontSize:13}}>⚠️ NF {dup.nf.numero}</span>
                        <span style={{padding:"2px 8px", borderRadius:99, fontSize:10, background:"#78350f33", color:"#fbbf24"}}>{dup.motivo}</span>
                      </div>
                      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px 16px"}}>
                        {[
                          ["Chave NF-e", dup.nf.chave ? dup.nf.chave.slice(0,20)+"..." : "—"],
                          ["Emissão",    dup.nf.dataEmissao || "—"],
                          ["Valor NF",   fmtBRL(dup.nf.valorNF||0)],
                          ["Frete",      fmtBRL(dup.nf.valorFrete||0)],
                          ["Parceiro",   dup.nf.parceiro || "—"],
                          ["Modalidade", dup.nf.modalidade || "—"],
                        ].map(([k,v],i)=>(
                          <div key={i} style={{fontSize:11}}>
                            <span style={{color:"#475569"}}>{k}: </span>
                            <span style={{color:"#cbd5e1"}}>{v}</span>
                          </div>
                        ))}
                      </div>

                      {/* Registro existente na base */}
                      {dup.freteDup && (
                        <div style={{marginTop:8, background:"#0d1321", borderRadius:6, padding:"6px 10px", borderLeft:"3px solid #3b82f6"}}>
                          <div style={{fontSize:10, color:"#3b82f6", fontWeight:600, marginBottom:3}}>📂 Registro existente na base:</div>
                          <div style={{display:"flex", gap:16, flexWrap:"wrap"}}>
                            {[
                              ["NF", dup.freteDup.nf],
                              ["Transp.", dup.freteDup.transportadora],
                              ["Frete", fmtBRL(dup.freteDup.valorFrete||0)],
                              ["Status", dup.freteDup.status],
                            ].map(([k,v],i)=>(
                              <div key={i} style={{fontSize:10}}>
                                <span style={{color:"#475569"}}>{k}: </span>
                                <span style={{color:"#94a3b8"}}>{v}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Botões de decisão */}
                    <div style={{display:"flex", flexDirection:"column", gap:6, minWidth:160}}>
                      <div style={{fontSize:10, color:"#475569", fontWeight:600, textAlign:"center", marginBottom:2}}>O que deseja fazer?</div>
                      <button
                        style={{...s.btnSecondary, fontSize:11, padding:"8px 12px",
                          background: dup.acao==="ignorar"?"#0f2d14":"#1e293b",
                          color:      dup.acao==="ignorar"?"#4ade80":"#94a3b8",
                          border:     dup.acao==="ignorar"?"1px solid #166534":"1px solid #334155",
                          fontWeight: dup.acao==="ignorar"?700:400}}
                        onClick={()=>setAcaoDup(idx,"ignorar")}>
                        ⏭️ Ignorar (manter atual)
                      </button>
                      <button
                        style={{...s.btnSecondary, fontSize:11, padding:"8px 12px",
                          background: dup.acao==="substituir"?"#2d1700":"#1e293b",
                          color:      dup.acao==="substituir"?"#f59e0b":"#94a3b8",
                          border:     dup.acao==="substituir"?"1px solid #92400e":"1px solid #334155",
                          fontWeight: dup.acao==="substituir"?700:400}}
                        onClick={()=>setAcaoDup(idx,"substituir")}>
                        🔄 Substituir na base
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Rodapé do modal */}
            <div style={{borderTop:"1px solid #1e293b", paddingTop:14, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
              <div style={{fontSize:11, color:"#475569"}}>
                ✅ {analise.novas.length} novas &nbsp;|&nbsp;
                🔄 {analise.pendente.filter(d=>d.acao==="substituir").length} serão substituídas &nbsp;|&nbsp;
                ⏭️ {analise.pendente.filter(d=>d.acao==="ignorar").length} serão ignoradas
              </div>
              <div style={{display:"flex", gap:8}}>
                <button style={{...s.btnSecondary, fontSize:12}} onClick={()=>setModalDup(false)}>
                  Cancelar tudo
                </button>
                <button style={{...s.btnPrimary, fontSize:12}} onClick={confirmarImportacao}>
                  ✅ Confirmar e Importar
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    funcionalidades: ["Rastreamento manual via site","Cotação por tabela contratual","Integração via Frenet (recomendado)"],
    status_api: "sem_api",
    obs: "A Favorita não possui API pública própria. Recomendamos integrar via plataforma Frenet (frenet.com.br), que já inclui a Favorita entre suas transportadoras conectadas.",
  },
];

function Integracoes() {
  const [creds, setCreds]         = useState(() => {
    try { return JSON.parse(localStorage.getItem("frete_integracoes") || "{}"); } catch { return {}; }
  });
  const [testando, setTestando]   = useState({});
  const [resultados, setResultados] = useState({});
  const [transpSel, setTranspSel] = useState(null);
  const [mostrarSenha, setMostrarSenha] = useState({});

  function salvarCred(transpId, key, val) {
    const novas = { ...creds, [transpId]: { ...(creds[transpId]||{}), [key]: val } };
    setCreds(novas);
    try { localStorage.setItem("frete_integracoes", JSON.stringify(novas)); } catch {}
  }

  async function testarConexao(transp) {
    const c = creds[transp.id] || {};
    setTestando(prev => ({...prev, [transp.id]: true}));
    setResultados(prev => ({...prev, [transp.id]: null}));

    // Simula teste de conexão (quando API estiver disponível, substituir pelo fetch real)
    await new Promise(r => setTimeout(r, 1800));

    const camposPreenchidos = transp.campos.filter(f => f.tipo !== "info").every(f => c[f.key] && c[f.key].trim());

    if (!camposPreenchidos) {
      setResultados(prev => ({...prev, [transp.id]: { ok: false, msg: "Preencha todos os campos antes de testar." }}));
    } else if (transp.status_api === "sem_api") {
      setResultados(prev => ({...prev, [transp.id]: { ok: false, msg: "Esta transportadora não possui API pública. Use integração via Frenet." }}));
    } else if (transp.status_api === "aguardando") {
      setResultados(prev => ({...prev, [transp.id]: { ok: null, msg: "Credenciais salvas! Conexão será ativada assim que a Jamef aprovar o acesso (até 2 dias úteis)." }}));
    } else {
      // Aqui vai o fetch real quando as APIs estiverem liberadas
      setResultados(prev => ({...prev, [transp.id]: { ok: false, msg: "API ainda não ativada. Credenciais salvas com sucesso — aguarde a liberação." }}));
    }
    setTestando(prev => ({...prev, [transp.id]: false}));
  }

  const statusInfo = (t) => {
    const r = resultados[t.id];
    if (testando[t.id]) return { cor:"#f59e0b", label:"Testando...", icon:"⏳" };
    if (r) {
      if (r.ok === true)  return { cor:"#22c55e", label:"Conectada", icon:"✅" };
      if (r.ok === null)  return { cor:"#f59e0b", label:"Aguardando", icon:"⏳" };
      return { cor:"#ef4444", label:"Erro", icon:"❌" };
    }
    const c = creds[t.id] || {};
    const preenchido = t.campos.some(f => c[f.key]);
    if (t.status_api === "sem_api") return { cor:"#64748b", label:"Sem API", icon:"⚠️" };
    if (t.status_api === "aguardando") return { cor:"#f59e0b", label:"Aguardando aprovação", icon:"⏳" };
    if (preenchido) return { cor:"#3b82f6", label:"Configurada", icon:"🔧" };
    return { cor:"#334155", label:"Não configurada", icon:"○" };
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Header informativo */}
      <div style={{...s.card,borderTop:"3px solid #3b82f6",background:"linear-gradient(135deg,#0d1321,#0d1f35)"}}>
        <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
          <div style={{fontSize:40}}>🔌</div>
          <div style={{flex:1}}>
            <h3 style={{color:"#93c5fd",fontWeight:700,fontSize:15,margin:0}}>Central de Integrações — Transportadoras</h3>
            <p style={{color:"#64748b",fontSize:12,marginTop:4}}>Conecte as APIs das suas transportadoras para rastreamento automático e cotação em tempo real diretamente no Torre de Controle.</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,minWidth:220}}>
            {[
              {label:"Transportadoras",val:TRANSPORTADORAS_CONFIG.length,cor:"#3b82f6"},
              {label:"Configuradas",val:TRANSPORTADORAS_CONFIG.filter(t=>(creds[t.id]&&Object.values(creds[t.id]).some(v=>v))).length,cor:"#22c55e"},
              {label:"Conectadas",val:Object.values(resultados).filter(r=>r?.ok===true).length,cor:"#4ade80"},
              {label:"Pendentes",val:TRANSPORTADORAS_CONFIG.filter(t=>t.status_api==="aguardando").length,cor:"#f59e0b"},
            ].map((k,i)=>(
              <div key={i} style={{background:"#0b1623",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                <div style={{fontSize:18,fontWeight:700,color:k.cor}}>{k.val}</div>
                <div style={{fontSize:10,color:"#475569"}}>{k.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Cards de transportadoras */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        {TRANSPORTADORAS_CONFIG.map(transp => {
          const st = statusInfo(transp);
          const c  = creds[transp.id] || {};
          const aberta = transpSel === transp.id;
          return (
            <div key={transp.id} style={{...s.card,borderTop:`3px solid ${transp.cor}`,transition:"all .2s"}}>
              {/* Cabeçalho do card */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:28}}>{transp.logo}</span>
                  <div>
                    <div style={{fontWeight:700,color:"#f8fafc",fontSize:14}}>{transp.nome}</div>
                    <div style={{fontSize:11,color:"#64748b",marginTop:1}}>{transp.descricao}</div>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                  <span style={{padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600,background:st.cor+"22",color:st.cor,whiteSpace:"nowrap"}}>
                    {st.icon} {st.label}
                  </span>
                </div>
              </div>

              {/* Funcionalidades */}
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>
                {transp.funcionalidades.map((f,i)=>(
                  <span key={i} style={{padding:"2px 8px",borderRadius:99,fontSize:10,background:"#1e293b",color:"#94a3b8",border:"1px solid #334155"}}>{f}</span>
                ))}
              </div>

              {/* Observação especial */}
              {transp.obs && (
                <div style={{background:"#0b1623",borderRadius:8,padding:"8px 10px",marginBottom:12,fontSize:11,color:"#94a3b8",borderLeft:`3px solid ${transp.cor}`}}>
                  ℹ️ {transp.obs}
                </div>
              )}

              {/* Botão expandir/fechar */}
              <button
                style={{...s.btnSecondary,width:"100%",marginBottom: aberta?12:0,fontSize:12,
                  background:aberta?"#1e3a5f":"#1e293b",
                  color:aberta?"#93c5fd":"#94a3b8",
                  border:aberta?"1px solid #3b82f6":"1px solid #334155"}}
                onClick={()=>setTranspSel(aberta?null:transp.id)}>
                {aberta?"▲ Fechar configuração":"⚙️ Configurar credenciais"}
              </button>

              {/* Formulário de credenciais */}
              {aberta && (
                <div style={{borderTop:"1px solid #1e293b",paddingTop:12}}>
                  {transp.status_api === "sem_api" ? (
                    <div style={{textAlign:"center",padding:"16px 0"}}>
                      <div style={{fontSize:32}}>⚠️</div>
                      <div style={{color:"#f59e0b",fontWeight:600,marginTop:8,fontSize:13}}>Sem API Própria</div>
                      <div style={{color:"#64748b",fontSize:12,marginTop:6,lineHeight:1.6}}>
                        A Favorita não possui API pública.<br/>
                        Recomendamos usar a <strong style={{color:"#22c55e"}}>Frenet</strong> como gateway.
                      </div>
                      <a href="https://frenet.com.br" target="_blank"
                        style={{display:"inline-block",marginTop:12,padding:"8px 16px",background:"#166534",color:"#4ade80",borderRadius:8,fontSize:12,textDecoration:"none",fontWeight:600}}>
                        🌐 Acessar Frenet →
                      </a>
                    </div>
                  ) : (
                    <>
                      <div style={{display:"flex",flexDirection:"column",gap:10}}>
                        {transp.campos.map(campo=>(
                          <div key={campo.key}>
                            <label style={s.label}>{campo.label}</label>
                            <div style={{position:"relative"}}>
                              <input
                                style={{...s.input,paddingRight: campo.tipo==="password"?"36px":"10px"}}
                                type={campo.tipo==="password" && !mostrarSenha[`${transp.id}_${campo.key}`] ? "password" : "text"}
                                placeholder={campo.placeholder}
                                value={c[campo.key]||""}
                                onChange={e=>salvarCred(transp.id, campo.key, e.target.value)}
                              />
                              {campo.tipo==="password" && (
                                <button
                                  style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:14,padding:2}}
                                  onClick={()=>setMostrarSenha(prev=>({...prev,[`${transp.id}_${campo.key}`]:!prev[`${transp.id}_${campo.key}`]}))}>
                                  {mostrarSenha[`${transp.id}_${campo.key}`]?"🙈":"👁️"}
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Resultado do teste */}
                      {resultados[transp.id] && (
                        <div style={{marginTop:12,padding:"10px 12px",borderRadius:8,background:resultados[transp.id].ok===true?"#14532d22":resultados[transp.id].ok===null?"#78350f22":"#7f1d1d22",border:`1px solid ${resultados[transp.id].ok===true?"#166534":resultados[transp.id].ok===null?"#92400e":"#991b1b"}`,fontSize:12,color:resultados[transp.id].ok===true?"#4ade80":resultados[transp.id].ok===null?"#fbbf24":"#fca5a5"}}>
                          {resultados[transp.id].ok===true?"✅":resultados[transp.id].ok===null?"⏳":"❌"} {resultados[transp.id].msg}
                        </div>
                      )}

                      <div style={{display:"flex",gap:8,marginTop:12}}>
                        <a href={transp.portal} target="_blank"
                          style={{flex:1,textAlign:"center",padding:"8px",background:"#1e293b",color:"#64748b",borderRadius:8,fontSize:11,textDecoration:"none",border:"1px solid #334155"}}>
                          🌐 Portal Developer
                        </a>
                        <button
                          style={{...s.btnPrimary,flex:2,fontSize:12,opacity:testando[transp.id]?0.7:1}}
                          disabled={testando[transp.id]}
                          onClick={()=>testarConexao(transp)}>
                          {testando[transp.id]
                            ? <span>⏳ Testando...</span>
                            : <span>🔗 Salvar e Testar Conexão</span>}
                        </button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Guia de ativação */}
      <div style={s.card}>
        <h3 style={s.cardTitle}>📋 Guia de Ativação — Passo a Passo</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginTop:14}}>
          {[
            {transp:"Jamef",cor:"#e63946",logo:"🚛",passos:["Acesse developers.jamef.com.br","Configurações → Produção","Clique em 'Configurar conta'","Aguarde aprovação (2 dias úteis)","Receba credenciais por e-mail","Cole aqui e teste a conexão"]},
            {transp:"Loggi",cor:"#7c3aed",logo:"⚡",passos:["Acesse docs.api.loggi.com","Contate o time de vendas Loggi","Solicite client_id e client_secret","Receba o company_id da sua empresa","Cole aqui e teste a conexão","Ative os webhooks de status"]},
            {transp:"Correios",cor:"#f59e0b",logo:"📮",passos:["Acesse cws.correios.com.br","Faça login com CNPJ do contrato","Gere as credenciais de API","Anote o cartão de postagem","Cole o CEP de origem do CD","Teste a conexão PAC/SEDEX"]},
            {transp:"Favorita",cor:"#22c55e",logo:"⭐",passos:["Acesse frenet.com.br","Crie uma conta gratuita","Vá em 'Transportadoras' → Favorita","Configure seu contrato na Frenet","A Frenet gera uma API unificada","Use as credenciais Frenet aqui"]},
          ].map((g,i)=>(
            <div key={i} style={{background:"#0b1623",borderRadius:8,padding:12,borderTop:`3px solid ${g.cor}`}}>
              <div style={{fontWeight:700,color:"#f8fafc",fontSize:12,marginBottom:10}}>{g.logo} {g.transp}</div>
              {g.passos.map((p,j)=>(
                <div key={j} style={{display:"flex",gap:8,marginBottom:6,alignItems:"flex-start"}}>
                  <span style={{minWidth:16,height:16,borderRadius:"50%",background:g.cor+"33",color:g.cor,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",marginTop:1}}>{j+1}</span>
                  <span style={{fontSize:10,color:"#94a3b8",lineHeight:1.4}}>{p}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>

      {/* Status geral */}
      <div style={{...s.card,background:"#0b1623",textAlign:"center",padding:20}}>
        <div style={{fontSize:11,color:"#475569"}}>
          🔒 As credenciais são salvas localmente no seu navegador e nunca enviadas para terceiros. &nbsp;|&nbsp;
          ⚡ Quando conectadas, as APIs atualizam status automaticamente a cada consulta. &nbsp;|&nbsp;
          📧 Dúvidas? Acesse o portal de desenvolvedores de cada transportadora.
        </div>
      </div>
    </div>
  );
}

// ─── Config ───────────────────────────────────────────────────────────────────
function Config({orcGlobal,setOrcGlobal,faturamento,setFaturamento}){
  const [valOrc,setValOrc]=useState(orcGlobal);
  const [valFat,setValFat]=useState(faturamento||0);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={s.card}>
        <h3 style={s.cardTitle}>⚙️ Configurações Gerais</h3>
        <div style={{marginTop:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,maxWidth:600}}>
          <div>
            <label style={s.label}>💹 Faturamento Total do Período (R$)</label>
            <input style={s.input} type="number" value={valFat} onChange={e=>setValFat(+e.target.value)}/>
            <div style={{fontSize:10,color:"#475569",marginTop:4}}>Usado para calcular % do frete sobre o faturamento no Dashboard</div>
          </div>
          <div>
            <label style={s.label}>📊 Orçamento Global Mensal de Frete (R$)</label>
            <input style={s.input} type="number" value={valOrc} onChange={e=>setValOrc(+e.target.value)}/>
            <div style={{fontSize:10,color:"#475569",marginTop:4}}>Usado para alertas de orçamento excedido</div>
          </div>
        </div>
        <button style={{...s.btnPrimary,marginTop:16}} onClick={()=>{setOrcGlobal(valOrc);setFaturamento(valFat);alert("✅ Configurações salvas!");}}>
          💾 Salvar Configurações
        </button>
      </div>
    </div>
  );
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function KPICard({icon,label,value,cor,destaque}){return(<div style={{...s.kpiCard,borderTop:`3px solid ${cor}`,boxShadow:destaque?`0 0 18px ${cor}44`:"none"}}><div style={{fontSize:24}}>{icon}</div><div style={{fontSize:22,fontWeight:700,color:"#f8fafc",marginTop:4}}>{value}</div><div style={{fontSize:12,color:"#64748b",marginTop:2}}>{label}</div></div>);}
function Field({label,value,onChange,type="text",placeholder=""}){return <div><label style={s.label}>{label}</label><input style={s.input} type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)}/></div>;}
function FieldSelect({label,value,onChange,options}){return <div><label style={s.label}>{label}</label><select style={s.input} value={value} onChange={e=>onChange(e.target.value)}>{options.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>;}

// ─── Estilos ──────────────────────────────────────────────────────────────────
const s={
  root:{display:"flex",height:"100vh",background:"#0b0f1a",color:"#e2e8f0",fontFamily:"'IBM Plex Sans','Segoe UI',sans-serif",overflow:"hidden"},
  sidebar:{width:220,background:"#0d1321",borderRight:"1px solid #1e293b",display:"flex",flexDirection:"column",padding:"20px 0",flexShrink:0},
  logo:{display:"flex",alignItems:"center",gap:10,padding:"0 20px 20px",borderBottom:"1px solid #1e293b"},
  logoTitle:{fontSize:15,fontWeight:700,color:"#f8fafc"},logoSub:{fontSize:10,color:"#475569",marginTop:1},
  nav:{padding:"16px 12px",flex:1,display:"flex",flexDirection:"column",gap:4},
  navBtn:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,border:"none",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:13,fontWeight:500,textAlign:"left",width:"100%",position:"relative"},
  navBtnAtivo:{background:"#1e3a5f",color:"#93c5fd"},
  badge:{position:"absolute",right:10,background:"#ef4444",color:"#fff",borderRadius:99,fontSize:10,padding:"1px 6px",fontWeight:700},
  sidebarBottom:{padding:"16px",borderTop:"1px solid #1e293b"},
  orcBox:{background:"#0b1623",borderRadius:8,padding:12},
  progressBar:{height:6,background:"#1e293b",borderRadius:99,overflow:"hidden"},
  progressFill:{height:"100%",borderRadius:99,transition:"width .4s"},
  main:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"},
  header:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"20px 28px",borderBottom:"1px solid #1e293b",flexShrink:0},
  pageTitle:{fontSize:22,fontWeight:700,color:"#f8fafc",margin:0},pageSub:{fontSize:12,color:"#475569",margin:"3px 0 0"},
  filtros:{display:"flex",gap:8,padding:"12px 28px",borderBottom:"1px solid #1e293b",flexShrink:0,flexWrap:"wrap"},
  searchInput:{flex:1,minWidth:160,background:"#1e293b",border:"1px solid #334155",borderRadius:8,color:"#e2e8f0",padding:"7px 12px",fontSize:13},
  select:{background:"#1e293b",border:"1px solid #334155",borderRadius:8,color:"#e2e8f0",padding:"7px 10px",fontSize:12},
  dashGrid:{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:14},
  card:{background:"#0d1321",border:"1px solid #1e293b",borderRadius:12,padding:18},
  cardTitle:{fontSize:13,fontWeight:600,color:"#94a3b8",margin:0},
  kpiCard:{background:"#0d1321",border:"1px solid #1e293b",borderRadius:12,padding:"16px",gridColumn:"span 1"},
  table:{width:"100%",borderCollapse:"collapse",fontSize:12},
  th:{textAlign:"left",padding:"8px 10px",color:"#475569",fontWeight:500,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"},
  td:{padding:"9px 10px",borderBottom:"1px solid #0f172a",color:"#cbd5e1",whiteSpace:"nowrap"},
  tr:{transition:"background .15s",cursor:"default"},
  alertRow:{display:"flex",gap:16,padding:"8px 0",borderBottom:"1px solid #1e293b",flexWrap:"wrap",fontSize:13,alignItems:"center"},
  alertChip:{background:"#1a0a0a",border:"1px solid #7f1d1d",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#fca5a5"},
  overlay:{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000},
  modal:{background:"#0d1321",border:"1px solid #1e293b",borderRadius:16,padding:24,width:"90%",maxWidth:720,maxHeight:"90vh",overflow:"auto"},
  modalHeader:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20},
  closeBtn:{background:"none",border:"none",color:"#64748b",fontSize:18,cursor:"pointer",padding:4},
  modalGrid:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 16px"},
  modalFooter:{display:"flex",justifyContent:"flex-end",gap:10,marginTop:20},
  label:{display:"block",fontSize:11,color:"#64748b",marginBottom:4,fontWeight:500},
  input:{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:8,color:"#e2e8f0",padding:"8px 10px",fontSize:13,boxSizing:"border-box"},
  btnPrimary:{background:"linear-gradient(135deg,#3b82f6,#2563eb)",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"},
  btnSecondary:{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:8,padding:"9px 18px",fontSize:13,cursor:"pointer"},
  dropZone:{border:"2px dashed #1e293b",borderRadius:16,padding:"48px 24px",textAlign:"center",cursor:"pointer",transition:"all .2s"},
};

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
