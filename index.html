// ── CRUD Supabase ─────────────────────────────────────────────────────────────
async function sbGet(table,query=""){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}&order=criado_em.desc`,{headers:SB_HEADERS});
  if(!r.ok){console.error("sbGet erro",r.status,await r.text());return[];}
  return r.json();
}
async function sbInsert(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:"POST",headers:{...SB_HEADERS,"Prefer":"return=representation"},body:JSON.stringify(data)});
  if(!r.ok){console.error("sbInsert erro",r.status,await r.text());return null;}
  const j=await r.json(); return Array.isArray(j)?j[0]:j;
}
async function sbUpsert(table,data,onConflict="id"){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:"POST",headers:{...SB_HEADERS,"Prefer":`return=representation,resolution=merge-duplicates`,"on-conflict":onConflict},body:JSON.stringify(data)});
  if(!r.ok){console.error("sbUpsert erro",r.status,await r.text());return null;}
  return r.json();
}
async function sbUpdate(table,id,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:"PATCH",headers:{...SB_HEADERS,"Prefer":"return=representation"},body:JSON.stringify(data)});
  if(!r.ok){console.error("sbUpdate erro",r.status,await r.text());return null;}
  return r.json();
}
async function sbDelete(table,id){
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:"DELETE",headers:SB_HEADERS});
}
async function sbDeleteWhere(table,field,val){
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?${field}=eq.${val}`,{method:"DELETE",headers:SB_HEADERS});
}

// ── Helpers de CNPJ ──────────────────────────────────────────────────────────
function normalizarCNPJ(cnpj) {
  return String(cnpj || "").replace(/\D/g, "");
}
function todosOazCNPJs() {
  return [
    ...OAZ_CNPJS.cds.map(c => normalizarCNPJ(c.cnpj)),
    ...OAZ_CNPJS.lojas.map(l => normalizarCNPJ(l.cnpj)),
  ];
}
function ehCNPJ_CD(cnpj) {
  return OAZ_CNPJS.cds.some(c => normalizarCNPJ(c.cnpj) === normalizarCNPJ(cnpj));
}
function ehCNPJ_Loja(cnpj) {
  return OAZ_CNPJS.lojas.some(l => normalizarCNPJ(l.cnpj) === normalizarCNPJ(cnpj));
}
function ehCNPJ_Oaz(cnpj) {
  return todosOazCNPJs().includes(normalizarCNPJ(cnpj));
}
function nomePorCNPJ(cnpj) {
  const cn = normalizarCNPJ(cnpj);
  const cd  = OAZ_CNPJS.cds.find(c  => normalizarCNPJ(c.cnpj)  === cn);
  const lj  = OAZ_CNPJS.lojas.find(l => normalizarCNPJ(l.cnpj) === cn);
  return cd?.nome || lj?.nome || cnpj;
}

// ── Classificador automático de tipo de frete ────────────────────────────────
// Retorna um dos 6 canais com base em emitente + destinatário + CFOP
function classificarTipoFrete({ cnpjEmit, cnpjDest, cfop, modFrete }) {
  const emit = normalizarCNPJ(cnpjEmit);
  const dest = normalizarCNPJ(cnpjDest);
  const cf   = String(cfop || "");

  const emitCD   = ehCNPJ_CD(emit);
  const emitLoja = ehCNPJ_Loja(emit);
  const destLoja = ehCNPJ_Loja(dest);
  const destOaz  = ehCNPJ_Oaz(dest);
  const destCPF  = dest.length <= 11; // CPF tem 11 dígitos

  // ① Devolução E-commerce — CPF emite para Oáz (CFOP 1.201 / 2.201)
  if (emit.length <= 11 && destOaz && (cf.startsWith("1.201") || cf.startsWith("2.201") || cf.startsWith("1201") || cf.startsWith("2201")))
    return "devolucao_ecommerce";

  // ② E-commerce — CD ou Loja emite para CPF cliente final
  if ((emitCD || emitLoja) && destCPF)
    return "ecommerce";

  // ③ Abastecimento de Lojas — CD emite para Loja Oáz (CFOP 6.152 / 5.152) — FOB
  if (emitCD && destLoja && (cf.includes("152") || cf === ""))
    return "abastecimento_lojas";

  // ④ Transferência entre Lojas — Loja emite para outra Loja Oáz
  if (emitLoja && destLoja && emit !== dest)
    return "transferencia_lojas";

  // ⑤ Produção — Remessa/retorno industrialização ou compra insumo (CFOP 5.901 / 1.902 / 1.101)
  if (cf.includes("901") || cf.includes("902") || cf.startsWith("1101") || cf.startsWith("1.101"))
    return "producao";

  // ⑥ Atacado — CD emite para CNPJ externo
  if (emitCD && !destOaz && !destCPF)
    return "atacado";

  return "outros";
}

function parsearCTe(xmlStr){try{const doc=parseXML(xmlStr);if(!doc.getElementsByTagName("CTe")[0]&&!doc.getElementsByTagName("cteProc")[0])return{erro:"Não é CT-e"};const chave=getTag(doc,"chCTe")||getAttr(doc,"infCte","Id")?.replace("CTe","");const nfRefs=[...Array.from(doc.getElementsByTagName("chave")).map(e=>e.textContent.trim()),...Array.from(doc.getElementsByTagName("infNFe")).map(e=>e.getElementsByTagName("chave")[0]?.textContent||e.getAttribute("chave")).filter(Boolean)];return{tipo_doc:"cte",chaveCTe:chave,nCT:`CT-e ${getTag(doc,"serie")||"0"}-${getTag(doc,"nCT")||"?"}`,transportadora:getTag(doc,"xNome")||"Transportadora",origem:(getTag(doc,"xMunIni")||"")+", "+(getTag(doc,"UFIni")||""),destino:(getTag(doc,"xMunFim")||"")+", "+(getTag(doc,"UFFim")||""),valorFrete:parseFloat(getTag(doc,"vTPrest")||getTag(doc,"vRec")||"0"),peso:parseFloat(getTag(doc,"pesoB")||getTag(doc,"qCarga")||"0"),mes:(getTag(doc,"dhEmi")||getTag(doc,"dEmi")||"").substring(0,7)||new Date().toISOString().slice(0,7),nfesReferenciadas:[...new Set(nfRefs)]};}catch(e){return{erro:"Falha CT-e: "+e.message};}}
function detectarTipoXML(x){if(x.includes("<NFe")||x.includes("<nfeProc"))return"nfe";if(x.includes("<CTe")||x.includes("<cteProc"))return"cte";return"desconhecido";}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [fretes,    setFretes]    = useState([]);
  const [loading,   setLoading]   = useState(true);

  React.useEffect(() => {
    async function carregar() {
      setLoading(true);
      try {
        const ccs = await sbGet("centros_custo");
        if (Array.isArray(ccs) && ccs.length > 0)
          setCentros(ccs.map(c => ({...c, orcamento: +c.orcamento})));
        const fs = await sbGet("fretes");
        const rs = await sbGet("rateios");
        if (Array.isArray(fs)) {
          setFretes(fs.map(f => ({
            ...f,
            valorNF: +f.valor_nf, valorFrete: +f.valor_frete,
            peso: +f.peso, orcamento: +f.orcamento,
            chaveNFe: f.chave_nfe, chaveCTe: f.chave_cte,
            rateios: Array.isArray(rs) ? rs.filter(r=>r.frete_id===f.id).map(r=>({ccId:r.cc_id,pct:+r.pct,tipoDespesa:r.tipo_despesa})) : []
          })));
        }
      } catch(e) { console.error("Erro:", e); }
      setLoading(false);
    }
    carregar();
  }, []);
  const [centros,   setCentros]   = useState([]);
  const [aba,       setAba]       = useState("dashboard");
  const [modalAberto, setModalAberto] = useState(false);
  const [editandoId,  setEditandoId]  = useState(null);
  const [filtroMes,   setFiltroMes]   = useState("todos");
  const [filtroTipo,  setFiltroTipo]  = useState("todos");
  const [filtroCC,    setFiltroCC]    = useState("todos");
  const [filtroDespesa, setFiltroDespesa] = useState("todos");
  const [busca,       setBusca]       = useState("");
  const [orcGlobal,    setOrcGlobal]   = useState(50000);
  const [faturamento,  setFaturamento] = useState(() => {
    try { return +localStorage.getItem("oaz_faturamento") || 0; } catch { return 0; }
  });
  const [contratos,   setContratos]   = useState([]);
  React.useEffect(()=>{
    sbGet("contratos").then(cs=>{
      sbGet("tabelas_frete").then(ts=>{
        if(Array.isArray(cs)) setContratos(cs.map(c=>({...c,tabelas:Array.isArray(ts)?ts.filter(t=>t.contrato_id===c.id):[]})));
      });
    }).catch(()=>{});
  },[]);
  const [form,        setForm]        = useState(emptyForm());

  /* rateio temporário no form */
  const [rateioTemp, setRateioTemp] = useState([]);

  const fretesVisiveis = useMemo(()=>fretes.filter(f=>{
    if(filtroMes!=="todos"&&f.mes!==filtroMes)return false;
    if(filtroTipo!=="todos"&&f.tipo!==filtroTipo)return false;
    if(filtroCC!=="todos"&&!f.rateios?.some(r=>r.ccId===filtroCC))return false;
    if(filtroDespesa!=="todos"&&!f.rateios?.some(r=>r.tipoDespesa===filtroDespesa))return false;
    if(busca&&!f.nf.toLowerCase().includes(busca.toLowerCase())&&!f.transportadora.toLowerCase().includes(busca.toLowerCase()))return false;
    return true;
  }),[fretes,filtroMes,filtroTipo,filtroCC,filtroDespesa,busca]);

  /* KPIs globais */
  const kpis = useMemo(()=>{
    const todos=fretesVisiveis;
    const totalFrete=todos.reduce((a,f)=>a+(f.valorFrete||0),0);
    const totalPeso=todos.reduce((a,f)=>a+(f.peso||0),0);
    const entregues=todos.filter(f=>f.status==="entregue");
    const atrasados=entregues.filter(f=>f.entrega&&f.prazo&&new Date(f.entrega)>new Date(f.prazo));
    const ontimeRate=entregues.length?((entregues.length-atrasados.length)/entregues.length*100).toFixed(1):0;
    const acimOrc=todos.filter(f=>f.valorFrete>f.orcamento&&f.orcamento>0);
    const porTransp={};todos.forEach(f=>{porTransp[f.transportadora]=(porTransp[f.transportadora]||0)+(f.valorFrete||0);});
    const porMes={};fretes.forEach(f=>{porMes[f.mes]=(porMes[f.mes]||0)+(f.valorFrete||0);});
    /* por centro de custo */
    const porCC={};
    todos.forEach(f=>(f.rateios||[]).forEach(r=>{
      const val=(f.valorFrete||0)*(r.pct/100);
      porCC[r.ccId]=(porCC[r.ccId]||0)+val;
    }));
    /* por tipo despesa */
    const porTipo={};
    todos.forEach(f=>(f.rateios||[]).forEach(r=>{
      const val=(f.valorFrete||0)*(r.pct/100);
      porTipo[r.tipoDespesa]=(porTipo[r.tipoDespesa]||0)+val;
    }));
    /* por canal de frete (6 tipos Oáz) */
    const porCanal={};
    todos.forEach(f=>{
      const c=f.canal||"outros";
      if(!porCanal[c]) porCanal[c]={total:0,qtd:0};
      porCanal[c].total+=(f.valorFrete||0);
      porCanal[c].qtd+=1;
    });
    return{totalFrete,totalPeso,ontimeRate,acimOrc,custoPorNF:todos.length?totalFrete/todos.length:0,custoPorKg:totalPeso?totalFrete/totalPeso:0,porTransp,porMes,porCC,porTipo,porCanal,totalNFs:todos.length};
  },[fretesVisiveis,fretes]);

  function abrirNovo(){ setForm(emptyForm()); setRateioTemp([]); setEditandoId(null); setModalAberto(true); }

  async function salvarFrete(){
    const totalPct=rateioTemp.reduce((a,r)=>a+ +r.pct,0);
    if(rateioTemp.length>0&&Math.abs(totalPct-100)>0.01){alert(`Os percentuais somam ${totalPct.toFixed(1)}%. Ajuste para 100%.`);return;}
    const id = editandoId || crypto.randomUUID();
    const novo={...form,id,valorNF:+form.valorNF,valorFrete:+form.valorFrete,peso:+form.peso,orcamento:+form.orcamento,qtdPecas:+form.qtdPecas||0,freteCliente:+form.freteCliente||0,chaveNFe:form.chaveNFe||null,chaveCTe:null,rateios:rateioTemp};

    // Salva no Supabase
    try {
      const dbFrete = {
        id, nf:novo.nf, chave_nfe:novo.chaveNFe, chave_cte:novo.chaveCTe,
        tipo:novo.tipo, canal:novo.canal||"outros", transportadora:novo.transportadora,
        modalidade:novo.modalidade, origem:novo.origem, destino:novo.destino,
        linha_produto:novo.linhaProduto||null,
        cnpj_emitente:novo.cnpjEmitente||"", cnpj_destinatario:novo.cnpjDestinatario||"",
        nome_emitente:novo.nomeEmitente||"", nome_destinatario:novo.nomeDestinatario||"",
        valor_nf:novo.valorNF, valor_frete:novo.valorFrete,
        frete_cliente:novo.freteCliente||0,
        peso:novo.peso, qtd_pecas:novo.qtdPecas||0, orcamento:novo.orcamento,
        mes:novo.mes, prazo:novo.prazo||null, entrega:novo.entrega||null, status:novo.status,
      };
      await sbUpsert("fretes", dbFrete);
      // Rateios: apaga antigos e insere novos
      if(editandoId) await sbDeleteWhere("rateios","frete_id",id);
      if(rateioTemp.length>0){
        await sbInsert("rateios", rateioTemp.map(r=>({id:crypto.randomUUID(),frete_id:id,cc_id:r.ccId,pct:r.pct,tipo_despesa:r.tipoDespesa})));
      }
    } catch(e){ console.warn("Supabase offline, salvando localmente:", e.message); }

    setFretes(prev=>editandoId?prev.map(f=>f.id===editandoId?novo:f):[novo,...prev]);
    setModalAberto(false);
  }

  async function importarFretes(novos){
    // Atualiza estado local
    setFretes(prev=>{
      const mapa={};prev.forEach(f=>{if(f.chaveNFe)mapa[f.chaveNFe]=f;});
      const res=[...prev];
      novos.forEach(n=>{
        if(n.chaveNFe&&mapa[n.chaveNFe]){const idx=res.findIndex(f=>f.chaveNFe===n.chaveNFe);if(idx>=0)res[idx]={...res[idx],...n};}
        else res.unshift({...n,id:n.id||crypto.randomUUID(),rateios:[]});
      });
      return res;
    });
    // Persiste no Supabase em lote
    try {
      const dbFretes = novos.map(n=>({
        id:n.id||crypto.randomUUID(), nf:n.nf, chave_nfe:n.chaveNFe||null, chave_cte:n.chaveCTe||null,
        tipo:n.tipo||"emitida", canal:n.canal||"outros", transportadora:n.transportadora||"",
        modalidade:n.modalidade||"CIF", origem:n.origem||"", destino:n.destino||"",
        cnpj_emitente:n.cnpjEmitente||"", cnpj_destinatario:n.cnpjDestinatario||"",
        nome_emitente:n.nomeEmitente||"", nome_destinatario:n.nomeDestinatario||"",
        valor_nf:n.valorNF||0, valor_frete:n.valorFrete||0, frete_cliente:n.freteCliente||0,
        peso:n.peso||0, qtd_pecas:n.qtdPecas||0, orcamento:n.orcamento||0,
        mes:n.mes||new Date().toISOString().slice(0,7),
        prazo:n.prazo||null, entrega:n.entrega||null, status:n.status||"pendente",
      }));
      await sbUpsert("fretes", dbFretes, "chave_nfe");
    } catch(e){ console.warn("Supabase offline:", e.message); }
  }

  async function salvarCentro(centro){
    try {
      await sbUpsert("centros_custo",{id:centro.id,codigo:centro.codigo,nome:centro.nome,filial:centro.filial,orcamento:centro.orcamento,ativo:true});
    } catch(e){ console.warn("Supabase offline:", e.message); }
    setCentros(prev=>prev.find(c=>c.id===centro.id)?prev.map(c=>c.id===centro.id?centro:c):[...prev,centro]);
  }

  async function deletarCentro(id){
    try { await sbDelete("centros_custo",id); } catch(e){ console.warn("Supabase offline:", e.message); }
    setCentros(prev=>prev.filter(c=>c.id!==id));
  }

  const [dbStatus, setDbStatus] = useState("conectando"); // conectando | ok | erro

  React.useEffect(()=>{
    // Testa conexão com Supabase
    sbGet("centros_custo","limit=1")
      .then(r=>{ setDbStatus(Array.isArray(r)?"ok":"erro"); })
      .catch(()=>setDbStatus("erro"));
  },[]);

  if(loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0d1321",flexDirection:"column",gap:16}}>
      <div style={{fontSize:48}}>🗼</div>
      <div style={{fontSize:18,fontWeight:700,color:"#f8fafc"}}>Torre de Controle</div>
      <div style={{fontSize:13,color:"#475569"}}>Carregando dados do banco...</div>
      <div style={{width:200,height:4,background:"#1e293b",borderRadius:99,overflow:"hidden",marginTop:8}}>
        <div style={{width:"60%",height:"100%",background:"linear-gradient(90deg,#3b82f6,#8b5cf6)",borderRadius:99,animation:"pulse 1.5s infinite"}}/>
      </div>
    </div>
  );

  return (
  const transportadorasUnicas=[...new Set(fretes.map(f=>f.transportadora))];
  const mesesUnicos=[...new Set(fretes.map(f=>f.mes))].sort();

    <div style={s.root}>
      {/* Sidebar */}
      <aside style={s.sidebar}>
        <div style={s.logo}><span style={{fontSize:28}}>🗼</span><div><div style={s.logoTitle}>Torre de Controle</div><div style={s.logoSub}>TMS · Oáz Moda</div></div></div>
        <nav style={s.nav}>
          {[{id:"dashboard",icon:"📊",label:"Dashboard"},{id:"custos",icon:"🏷️",label:"Centros de Custo"},{id:"fretes",icon:"📦",label:"Fretes & NFs"},{id:"contratos",icon:"📋",label:"Contratos"},{id:"importar",icon:"📂",label:"Importar XML"},{id:"alertas",icon:"🔔",label:"Alertas"},{id:"relatorio",icon:"📑",label:"Relatório Mensal"},{id:"buscaNFs",icon:"🔍",label:"Busca NFs SEFAZ"},{id:"integracoes",icon:"🔌",label:"Integrações"},{id:"config",icon:"⚙️",label:"Configurações"}].map(item=>(
            <button key={item.id} style={aba===item.id?{...s.navBtn,...s.navBtnAtivo}:s.navBtn} onClick={()=>setAba(item.id)}>
              <span>{item.icon}</span><span>{item.label}</span>
              {item.id==="alertas"&&kpis.acimOrc.length>0&&<span style={s.badge}>{kpis.acimOrc.length}</span>}
            </button>
          ))}
        </nav>
        <div style={s.sidebarBottom}>
          <div style={s.orcBox}>
            <div style={{fontSize:10,color:"#64748b",marginBottom:4}}>Orçamento Global</div>
            <div style={{fontSize:15,fontWeight:700,color:"#f8fafc",marginBottom:8}}>{fmtBRL(orcGlobal)}</div>
            <div style={s.progressBar}><div style={{...s.progressFill,width:`${Math.min(100,kpis.totalFrete/orcGlobal*100)}%`,background:kpis.totalFrete>orcGlobal?"#ef4444":"#22c55e"}}/></div>
            <div style={{fontSize:10,color:"#64748b",marginTop:4}}>{(kpis.totalFrete/orcGlobal*100).toFixed(0)}% utilizado</div>
          </div>
          <div style={{marginTop:10,padding:"6px 10px",borderRadius:8,background:"#0b1623",display:"flex",alignItems:"center",gap:6,border:`1px solid ${dbStatus==="ok"?"#166534":dbStatus==="erro"?"#7f1d1d":"#334155"}`}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:dbStatus==="ok"?"#22c55e":dbStatus==="erro"?"#ef4444":"#f59e0b"}}/>
            <span style={{fontSize:10,color:dbStatus==="ok"?"#4ade80":dbStatus==="erro"?"#f87171":"#fbbf24"}}>
              {dbStatus==="ok"?"Banco conectado":dbStatus==="erro"?"Banco offline":"Conectando..."}
            </span>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={s.main}>
        <header style={s.header}>
          <div>
            <h1 style={s.pageTitle}>{({dashboard:"Dashboard",custos:"Centros de Custo & Despesas",fretes:"Fretes & Notas Fiscais",importar:"Importar XML",alertas:"Alertas",relatorio:"Relatório Mensal",buscaNFs:"Busca NFs SEFAZ — CIF & FOB",integracoes:"Integrações com Transportadoras",config:"Configurações"})[aba]}</h1>
            <p style={s.pageSub}>Gestão de custos e performance de frete</p>
          </div>
          <button style={s.btnPrimary} onClick={abrirNovo}>+ Novo Frete / NF</button>
        </header>

        {/* Filtros */}
        <div style={s.filtros}>
          <input style={s.searchInput} placeholder="🔍  Buscar NF ou transportadora…" value={busca} onChange={e=>setBusca(e.target.value)}/>
          <select style={s.select} value={filtroMes} onChange={e=>setFiltroMes(e.target.value)}><option value="todos">Todos os meses</option>{mesesUnicos.map(m=><option key={m} value={m}>{m}</option>)}</select>
          <select style={s.select} value={filtroCC} onChange={e=>setFiltroCC(e.target.value)}><option value="todos">Todos os C.Custo</option>{centros.map(c=><option key={c.id} value={c.id}>{c.codigo} – {c.nome} / {c.filial}</option>)}</select>
          <select style={s.select} value={filtroDespesa} onChange={e=>setFiltroDespesa(e.target.value)}><option value="todos">Todos os tipos</option>{TIPOS_DESPESA.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <select style={s.select} value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)}><option value="todos">Emitidas e Recebidas</option><option value="emitida">Emitidas</option><option value="recebida">Recebidas</option></select>
        </div>

        <div style={{flex:1,overflowY:"scroll",overflowX:"hidden",padding:"20px 28px",minHeight:0}}>
          {aba==="dashboard" && <Dashboard kpis={kpis} fretes={fretesVisiveis} centros={centros} fmtBRL={fmtBRL} fmtPct={fmtPct} faturamento={faturamento} setFaturamento={f=>{setFaturamento(f);try{localStorage.setItem("oaz_faturamento",f);}catch{}}}/>}
          {aba==="custos"    && <CentrosCusto centros={centros} setCentros={setCentros} fretes={fretesVisiveis} kpis={kpis} fmtBRL={fmtBRL} fmtPct={fmtPct} onSalvar={salvarCentro} onDeletar={deletarCentro}/>}
          {aba==="fretes"    && <TabelaFretes fretes={fretesVisiveis} centros={centros} fmtBRL={fmtBRL} fmtDate={fmtDate}/>}
          {aba==="contratos" && <Contratos contratos={contratos} setContratos={setContratos} fmtBRL={fmtBRL}/>}
          {aba==="importar"  && <ImportarExcel fretes={fretes} onImportar={importarFretes} centros={centros} setCentros={setCentros} fmtBRL={fmtBRL}/>}
          {aba==="alertas"   && <Alertas fretes={fretesVisiveis} centros={centros} kpis={kpis} fmtBRL={fmtBRL} fmtDate={fmtDate}/>}
          {aba==="relatorio" && <Relatorio fretes={fretes} centros={centros} fmtBRL={fmtBRL} fmtDate={fmtDate} fmtPct={fmtPct}/>}
          {aba==="buscaNFs"  && <BuscaNFs onImportar={importarFretes} fretes={fretes} centros={centros} fmtBRL={fmtBRL} fmtDate={fmtDate}/>}
          {aba==="integracoes" && <Integracoes/>}
          {aba==="config"    && <Config orcGlobal={orcGlobal} setOrcGlobal={setOrcGlobal} faturamento={faturamento} setFaturamento={f=>{setFaturamento(f);try{localStorage.setItem("oaz_faturamento",f);}catch{}}}/>}
        </div>
      </main>

      {/* Modal frete */}
      {modalAberto&&(
        <div style={s.overlay} onClick={()=>setModalAberto(false)}>
          <div style={{...s.modal,maxWidth:780}} onClick={e=>e.stopPropagation()}>
            <div style={s.modalHeader}><h2 style={{fontSize:17,fontWeight:700,color:"#f8fafc",margin:0}}>Novo Registro de Frete / NF</h2><button style={s.closeBtn} onClick={()=>setModalAberto(false)}>✕</button></div>
            <div style={s.modalGrid}>
              <Field label="Número da NF" value={form.nf} onChange={v=>setForm({...form,nf:v})}/>
              <FieldSelect label="Tipo de NF" value={form.tipo} onChange={v=>setForm({...form,tipo:v})} options={[["emitida","Emitida"],["recebida","Recebida"]]}/>
              <Field label="Transportadora" value={form.transportadora} onChange={v=>setForm({...form,transportadora:v})}/>
              <FieldSelect label="Modalidade" value={form.modalidade} onChange={v=>setForm({...form,modalidade:v})} options={MODALIDADES.map(m=>[m,m])}/>
              <Field label="Origem" value={form.origem} onChange={v=>setForm({...form,origem:v})} placeholder="Cidade, UF"/>
              <Field label="Destino" value={form.destino} onChange={v=>setForm({...form,destino:v})} placeholder="Cidade, UF"/>
              <Field label="Valor NF (R$)" type="number" value={form.valorNF} onChange={v=>setForm({...form,valorNF:v})}/>
              <Field label="Valor Frete (R$)" type="number" value={form.valorFrete} onChange={v=>setForm({...form,valorFrete:v})}/>
              <Field label="Peso (kg)" type="number" value={form.peso} onChange={v=>setForm({...form,peso:v})}/>
              <Field label="Orçamento (R$)" type="number" value={form.orcamento} onChange={v=>setForm({...form,orcamento:v})}/>
              <Field label="Prazo" type="date" value={form.prazo} onChange={v=>setForm({...form,prazo:v})}/>
              <Field label="Entrega Real" type="date" value={form.entrega} onChange={v=>setForm({...form,entrega:v})}/>
              <FieldSelect label="Status" value={form.status} onChange={v=>setForm({...form,status:v})} options={STATUS_OPTS.map(st=>[st,statusLabel[st]])}/>
              <Field label="Mês" type="month" value={form.mes} onChange={v=>setForm({...form,mes:v})}/>
            </div>
            {/* Rateio */}
            <RateioEditor rateios={rateioTemp} setRateios={setRateioTemp} centros={centros} fmtBRL={fmtBRL} valorFrete={+form.valorFrete||0}/>
            <div style={s.modalFooter}>
              <button style={s.btnSecondary} onClick={()=>setModalAberto(false)}>Cancelar</button>
              <button style={s.btnPrimary} onClick={salvarFrete}>Salvar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── RateioEditor ─────────────────────────────────────────────────────────────
function RateioEditor({rateios,setRateios,centros,fmtBRL,valorFrete}){
  const totalPct=rateios.reduce((a,r)=>a+ +r.pct,0);
  const ok=rateios.length===0||Math.abs(totalPct-100)<0.01;
  function add(){setRateios([...rateios,{ccId:centros[0]?.id||"",pct:rateios.length===0?100:0,tipoDespesa:"frete_compra"}]);}
  function rm(i){setRateios(rateios.filter((_,j)=>j!==i));}
  function upd(i,k,v){setRateios(rateios.map((r,j)=>j===i?{...r,[k]:v}:r));}
  return(
    <div style={{marginTop:18,borderTop:"1px solid #1e293b",paddingTop:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontWeight:600,color:"#94a3b8",fontSize:13}}>📊 Rateio por Centro de Custo</span>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:12,color:ok?"#22c55e":"#ef4444",fontWeight:600}}>{rateios.length>0?`Total: ${totalPct.toFixed(0)}%${ok?" ✓":" ⚠️ deve ser 100%"}`:""}</span>
          <button style={{...s.btnSecondary,padding:"4px 10px",fontSize:12}} onClick={add}>+ Linha</button>
        </div>
      </div>
      {rateios.length===0&&<div style={{color:"#475569",fontSize:12,padding:"8px 0"}}>Nenhum rateio definido — o frete será lançado sem centro de custo.</div>}
      {rateios.map((r,i)=>(
        <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:8,marginBottom:8,alignItems:"end"}}>
          <div>
            {i===0&&<label style={s.label}>Centro de Custo</label>}
            <select style={s.input} value={r.ccId} onChange={e=>upd(i,"ccId",e.target.value)}>
              {centros.map(c=><option key={c.id} value={c.id}>{c.codigo} – {c.nome} / {c.filial}</option>)}
            </select>
          </div>
          <div>
            {i===0&&<label style={s.label}>Tipo de Despesa</label>}
            <select style={s.input} value={r.tipoDespesa} onChange={e=>upd(i,"tipoDespesa",e.target.value)}>
              {TIPOS_DESPESA.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          <div>
            {i===0&&<label style={s.label}>% Rateio → {fmtBRL(valorFrete*(r.pct/100))}</label>}
            <input style={s.input} type="number" min="0" max="100" value={r.pct} onChange={e=>upd(i,"pct",e.target.value)}/>
          </div>
          <button style={{...s.closeBtn,padding:"8px",background:"#1e293b",borderRadius:6}} onClick={()=>rm(i)}>✕</button>
        </div>
      ))}
    </div>
  );
}

// ─── Dashboard — Torre de Controle ───────────────────────────────────────────
function Dashboard({kpis,fretes,centros,fmtBRL,fmtPct,faturamento,setFaturamento}){
  const [editFat, setEditFat] = useState(false);
  const [fatTemp, setFatTemp] = useState(faturamento||0);
  const [abaCanal, setAbaCanal] = useState("visao_geral");
  const transpEntries = Object.entries(kpis.porTransp).sort((a,b)=>b[1]-a[1]);
  const mesEntries    = Object.entries(kpis.porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  const ccEntries     = Object.entries(kpis.porCC).sort((a,b)=>b[1]-a[1]);
  const maxT  = Math.max(...transpEntries.map(e=>e[1]),1);
  const maxM  = Math.max(...mesEntries.map(e=>e[1]),1);
  const maxCC = Math.max(...ccEntries.map(e=>e[1]),1);
  const totalCanal = Object.values(kpis.porCanal||{}).reduce((a,c)=>a+c.total,0)||1;

  // ── Helpers de performance de entrega ─────────────────────────────────────
  function calcPerformance(lista) {
    const comDatas = lista.filter(f=>f.prazo&&f.entrega&&f.status==="entregue");
    const antecipadas = comDatas.filter(f=>f.entrega<f.prazo).length;
    const noPrazo     = comDatas.filter(f=>f.entrega===f.prazo).length;
    const atrasadas   = comDatas.filter(f=>f.entrega>f.prazo).length;
    const total = comDatas.length||1;
    return { antecipadas, noPrazo, atrasadas, total: comDatas.length,
      pctAnt: (antecipadas/total*100).toFixed(0),
      pctNo:  (noPrazo/total*100).toFixed(0),
      pctAt:  (atrasadas/total*100).toFixed(0) };
  }

  function BadgePerf({p}) {
    return (
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
        <span style={{padding:"2px 8px",borderRadius:99,fontSize:10,background:"#14532d22",color:"#4ade80",border:"1px solid #166534"}}>⚡ {p.pctAnt}% antecipado</span>
        <span style={{padding:"2px 8px",borderRadius:99,fontSize:10,background:"#1e3a5f22",color:"#60a5fa",border:"1px solid #1e3a5f"}}>✅ {p.pctNo}% no prazo</span>
        <span style={{padding:"2px 8px",borderRadius:99,fontSize:10,background:"#7f1d1d22",color:"#f87171",border:"1px solid #991b1b"}}>⚠️ {p.pctAt}% atrasado</span>
        {p.total===0&&<span style={{fontSize:10,color:"#475569"}}>Sem datas registradas</span>}
      </div>
    );
  }

  // ── Cálculos por canal ────────────────────────────────────────────────────
  const porCanal = (canal) => fretes.filter(f=>f.canal===canal);

  // ① Abastecimento Lojas
  const fAbast = porCanal("abastecimento_lojas");
  const abast = {
    valorNF:    fAbast.reduce((a,f)=>a+(f.valorNF||0),0),
    valorFrete: fAbast.reduce((a,f)=>a+(f.valorFrete||0),0),
    qtdPecas:   fAbast.reduce((a,f)=>a+(f.qtdPecas||0),0),
    qtdNFs:     fAbast.length,
    perf:       calcPerformance(fAbast),
    porLinha:   fAbast.reduce((acc,f)=>{const l=f.linhaProduto||"Não informado";acc[l]=(acc[l]||{nfs:0,frete:0,valorNF:0,pecas:0});acc[l].nfs++;acc[l].frete+=(f.valorFrete||0);acc[l].valorNF+=(f.valorNF||0);acc[l].pecas+=(f.qtdPecas||0);return acc;},{}),
  };
  abast.pctFrete = abast.valorNF ? (abast.valorFrete/abast.valorNF*100).toFixed(2) : 0;
  abast.custoPeca = abast.qtdPecas ? (abast.valorFrete/abast.qtdPecas).toFixed(2) : 0;

  // ② Transferência entre Lojas
  const fTransf = porCanal("transferencia_lojas");
  const transf = {
    valorNF:    fTransf.reduce((a,f)=>a+(f.valorNF||0),0),
    valorFrete: fTransf.reduce((a,f)=>a+(f.valorFrete||0),0),
    qtdNFs:     fTransf.length,
    perf:       calcPerformance(fTransf),
  };
  transf.pctFrete = transf.valorNF ? (transf.valorFrete/transf.valorNF*100).toFixed(2) : 0;

  // ③ Atacado
  const fAtac = porCanal("atacado");
  const atac = {
    valorNF:    fAtac.reduce((a,f)=>a+(f.valorNF||0),0),
    valorFrete: fAtac.reduce((a,f)=>a+(f.valorFrete||0),0),
    qtdNFs:     fAtac.length,
    perf:       calcPerformance(fAtac),
  };
  atac.pctFrete   = atac.valorNF   ? (atac.valorFrete/atac.valorNF*100).toFixed(2) : 0;
  atac.custoPorNF = atac.qtdNFs    ? (atac.valorFrete/atac.qtdNFs).toFixed(2) : 0;

  // ④ E-commerce
  const fEcom = porCanal("ecommerce");
  const ecom = {
    valorNF:       fEcom.reduce((a,f)=>a+(f.valorNF||0),0),
    valorFrete:    fEcom.reduce((a,f)=>a+(f.valorFrete||0),0),
    freteCliente:  fEcom.reduce((a,f)=>a+(f.freteCliente||0),0),
    qtdNFs:        fEcom.length,
    perf:          calcPerformance(fEcom),
  };
  ecom.pctFrete       = ecom.valorNF    ? (ecom.valorFrete/ecom.valorNF*100).toFixed(2) : 0;
  ecom.fretePorPedido = ecom.qtdNFs     ? (ecom.valorFrete/ecom.qtdNFs).toFixed(2) : 0;
  ecom.freteSubsidiado = ecom.valorFrete ? ((ecom.valorFrete-ecom.freteCliente)/ecom.valorFrete*100).toFixed(1) : 0;
  ecom.cobertura      = ecom.valorFrete  ? (ecom.freteCliente/ecom.valorFrete*100).toFixed(1) : 0;

  // ⑤ Devolução
  const fDev = porCanal("devolucao_ecommerce");
  const dev = {
    valorNF:    fDev.reduce((a,f)=>a+(f.valorNF||0),0),
    valorFrete: fDev.reduce((a,f)=>a+(f.valorFrete||0),0),
    qtdNFs:     fDev.length,
  };

  // ── Painel de KPI inline ─────────────────────────────────────────────────
  function MetricBox({label,value,sub,cor="#f8fafc",destaque=false}) {
    return (
      <div style={{background:"#0b1623",borderRadius:8,padding:"10px 14px",borderLeft:`3px solid ${cor}`,flex:1,minWidth:120}}>
        <div style={{fontSize:11,color:"#475569",marginBottom:3}}>{label}</div>
        <div style={{fontSize:16,fontWeight:700,color:cor}}>{value}</div>
        {sub&&<div style={{fontSize:10,color:"#64748b",marginTop:2}}>{sub}</div>}
      </div>
    );
  }

  // ── Abas de canal ────────────────────────────────────────────────────────
  const ABAS = [
    {id:"visao_geral",    icon:"🗺️",  label:"Visão Geral"},
    {id:"abastecimento",  icon:"🏪",  label:"Abastecimento Lojas"},
    {id:"transferencia",  icon:"🔄",  label:"Transferência"},
    {id:"atacado",        icon:"📦",  label:"Atacado"},
    {id:"ecommerce",      icon:"🛒",  label:"E-commerce"},
    {id:"transporte",     icon:"🚚",  label:"Transportadoras"},
    {id:"evolucao",       icon:"📅",  label:"Evolução"},
  ];

  // ── Cálculos de faturamento ───────────────────────────────────────────────
  const pctFreteFat = faturamento ? (kpis.totalFrete / faturamento * 100).toFixed(2) : null;
  const pctFreteAlerta = pctFreteFat ? +pctFreteFat > 5 : false;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* ── KPIs Globais ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr) 1fr 1fr 1fr",gap:10,alignItems:"stretch"}}>

        {/* Faturamento — campo editável */}
        <div style={{...s.card,borderTop:"3px solid #22c55e",gridColumn:"span 1",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>💹 Faturamento Total (Período)</div>
          {editFat ? (
            <div style={{display:"flex",gap:6,alignItems:"center",marginTop:4}}>
              <input
                style={{...s.input,fontSize:14,fontWeight:700,flex:1,padding:"6px 10px"}}
                type="number" value={fatTemp}
                onChange={e=>setFatTemp(+e.target.value)}
                autoFocus
                onKeyDown={e=>{if(e.key==="Enter"){setFaturamento(fatTemp);setEditFat(false);}if(e.key==="Escape")setEditFat(false);}}
              />
              <button style={{...s.btnPrimary,padding:"6px 12px",fontSize:12}} onClick={()=>{setFaturamento(fatTemp);setEditFat(false);}}>✓</button>
            </div>
          ) : (
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}}>
              <div style={{fontSize:18,fontWeight:700,color:"#4ade80"}}>
                {faturamento ? fmtBRL(faturamento) : <span style={{color:"#475569",fontSize:13}}>Não informado</span>}
              </div>
              <button onClick={()=>{setFatTemp(faturamento);setEditFat(true);}}
                style={{background:"none",border:"1px solid #334155",borderRadius:6,color:"#64748b",cursor:"pointer",padding:"3px 8px",fontSize:11}}>
                ✏️ Editar
              </button>
            </div>
          )}
          <div style={{fontSize:10,color:"#475569",marginTop:6}}>Clique em Editar para atualizar o faturamento do período</div>
        </div>

        {/* Custo Total Frete */}
        <div style={{...s.card,borderTop:"3px solid #3b82f6",gridColumn:"span 1"}}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>💰 Custo Total com Frete</div>
          <div style={{fontSize:18,fontWeight:700,color:"#3b82f6",marginTop:4}}>{fmtBRL(kpis.totalFrete)}</div>
          <div style={{fontSize:10,color:"#475569",marginTop:6}}>{kpis.totalNFs} NFs no período</div>
        </div>

        {/* % Frete / Faturamento */}
        <div style={{...s.card,borderTop:`3px solid ${pctFreteAlerta?"#ef4444":"#22c55e"}`,gridColumn:"span 1"}}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>📊 % Frete s/ Faturamento</div>
          {pctFreteFat ? (
            <>
              <div style={{fontSize:22,fontWeight:700,color:pctFreteAlerta?"#f87171":"#4ade80",marginTop:4}}>{pctFreteFat}%</div>
              <div style={{...s.progressBar,marginTop:8}}>
                <div style={{...s.progressFill,width:`${Math.min(100,+pctFreteFat/10*100)}%`,background:pctFreteAlerta?"#ef4444":"#22c55e"}}/>
              </div>
              <div style={{fontSize:10,marginTop:4,color:pctFreteAlerta?"#f87171":"#4ade80"}}>
                {pctFreteAlerta?"⚠️ Acima do ideal (meta: abaixo de 5%)":"✅ Dentro da meta (abaixo de 5%)"}
              </div>
            </>
          ) : (
            <div style={{fontSize:12,color:"#475569",marginTop:8}}>Informe o faturamento ao lado para calcular</div>
          )}
        </div>

        {/* On-Time */}
        <KPICard icon="✅" label="On-Time Global"       value={`${kpis.ontimeRate}%`}    cor="#22c55e"/>
        {/* Custo/NF */}
        <KPICard icon="📦" label="Custo por NF"          value={fmtBRL(kpis.custoPorNF)} cor="#f59e0b"/>
        {/* Acima orç */}
        <KPICard icon="⚠️" label="Acima do Orçamento"   value={kpis.acimOrc.length}      cor="#ef4444" destaque={kpis.acimOrc.length>0}/>
      </div>

      {/* ── Navegação por canal ── */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",background:"#0b1623",padding:8,borderRadius:10}}>
        {ABAS.map(a=>(
          <button key={a.id}
            onClick={()=>setAbaCanal(a.id)}
            style={{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,
              background: abaCanal===a.id?"linear-gradient(135deg,#1e3a5f,#1e293b)":"transparent",
              color:      abaCanal===a.id?"#93c5fd":"#475569",
              borderBottom: abaCanal===a.id?"2px solid #3b82f6":"2px solid transparent"}}>
            {a.icon} {a.label}
          </button>
        ))}
      </div>

      {/* ════════════════════════════════════════════════════════════════════ */}
      {/* ABA: VISÃO GERAL                                                    */}
      {/* ════════════════════════════════════════════════════════════════════ */}
      {abaCanal==="visao_geral" && (
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Mapa de canais */}
          <div style={{...s.card,borderTop:"3px solid #3b82f6"}}>
            <h3 style={s.cardTitle}>🗺️ Custo de Frete por Canal — Oáz Moda</h3>
            <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginTop:12}}>
              {Object.entries(TIPOS_FRETE_CANAL).map(([key,cfg])=>{
                const d=kpis.porCanal?.[key]||{total:0,qtd:0};
                return(
                  <div key={key} onClick={()=>setAbaCanal(
                    {abastecimento_lojas:"abastecimento",transferencia_lojas:"transferencia",
                     atacado:"atacado",ecommerce:"ecommerce"}[key]||"visao_geral"
                  )} style={{background:"#0b1623",borderRadius:8,padding:12,borderTop:`3px solid ${cfg.cor}`,textAlign:"center",cursor:"pointer",transition:"opacity .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.opacity=".8"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                    <div style={{fontSize:24}}>{cfg.icon}</div>
                    <div style={{fontSize:14,fontWeight:700,color:cfg.cor,marginTop:6}}>{fmtBRL(d.total)}</div>
                    <div style={{fontSize:10,fontWeight:600,color:"#f8fafc",marginTop:2}}>{cfg.label}</div>
                    <div style={{fontSize:10,color:"#475569",marginTop:1}}>{d.qtd} NFs</div>
                    <div style={{fontSize:10,color:"#64748b"}}>{d.total?(d.total/totalCanal*100).toFixed(1):0}% do total</div>
                    <div style={{...s.progressBar,marginTop:6}}><div style={{...s.progressFill,width:`${d.total/totalCanal*100}%`,background:cfg.cor}}/></div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* CC + Tipo Despesa */}
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}>
            <div style={s.card}>
              <h3 style={s.cardTitle}>🏢 Custo por Centro de Custo</h3>
              <div style={{marginTop:12}}>
                {ccEntries.slice(0,8).map(([ccId,val])=>{
                  const cc=centros.find(c=>c.id===ccId);
                  const pct=cc?.orcamento?val/cc.orcamento*100:null;
                  return(
                    <div key={ccId} style={{marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                        <span style={{color:"#cbd5e1"}}><span style={{color:"#475569",marginRight:6}}>{cc?.codigo}</span>{cc?.nome} <span style={{color:"#475569"}}>/ {cc?.filial}</span></span>
                        <span style={{fontWeight:600,color:"#f8fafc"}}>{fmtBRL(val)}{pct!==null&&<span style={{marginLeft:6,color:pct>100?"#f87171":"#64748b",fontSize:10}}>({pct.toFixed(0)}%)</span>}</span>
                      </div>
                      <div style={s.progressBar}><div style={{...s.progressFill,width:`${val/maxCC*100}%`,background:`linear-gradient(90deg,${pct>100?"#ef4444":"#3b82f6"},${pct>100?"#f87171":"#8b5cf6"})`}}/></div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={s.card}>
              <h3 style={s.cardTitle}>🏷️ Por Tipo de Despesa</h3>
              <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
                {Object.entries(kpis.porTipo).sort((a,b)=>b[1]-a[1]).map(([tid,val])=>{
                  const t=tipoDespesaInfo(tid);
                  const tot=Object.values(kpis.porTipo).reduce((a,v)=>a+v,0)||1;
                  return(
                    <div key={tid}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                        <span style={{color:t.cor}}>{t.label}</span>
                        <span style={{color:"#f8fafc",fontWeight:600}}>{fmtBRL(val)} <span style={{color:"#64748b"}}>({(val/tot*100).toFixed(0)}%)</span></span>
                      </div>
                      <div style={s.progressBar}><div style={{...s.progressFill,width:`${val/tot*100}%`,background:t.cor}}/></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ════════════════════════════════════════════════════════════════════ */}
      {/* ABA: ABASTECIMENTO DE LOJAS                                         */}
      {/* ════════════════════════════════════════════════════════════════════ */}
      {abaCanal==="abastecimento" && (
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{...s.card,borderTop:"3px solid #3b82f6"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div>
                <h3 style={{...s.cardTitle,color:"#60a5fa"}}>🏪 Abastecimento de Lojas — CD → Lojas Oáz (FOB)</h3>
                <p style={{color:"#475569",fontSize:11,marginTop:2}}>{abast.qtdNFs} NFs · Frete FOB — custo pelo tomador (loja)</p>
              </div>
            </div>
            {/* Métricas principais */}
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
              <MetricBox label="Valor Total Transferido" value={fmtBRL(abast.valorNF)}   cor="#3b82f6" sub={`${abast.qtdNFs} NFs de transferência`}/>
              <MetricBox label="Custo Total do Frete"    value={fmtBRL(abast.valorFrete)} cor="#f59e0b" sub="Pago pelas lojas (FOB)"/>
              <MetricBox label="% Frete / Valor NF"      value={`${abast.pctFrete}%`}     cor={+abast.pctFrete>5?"#ef4444":"#22c55e"} sub="Ideal: abaixo de 5%"/>

                  {+ecom.perf.pctNo>0 &&<div style={{width:`${ecom.perf.pctNo}%`, background:"#3b82f6"}}/>}

            <table style={s.table}>

                {transpEntries.map(([nome,val],i)=>(

          <h3 style={s.cardTitle}>📅 Evolução Mensal do Custo de Frete</h3>

            {mesEntries.map(([mes,val])=>(
              <div key={mes} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,minWidth:36}}>

                    <tr key={mes} style={s.tr}>

                  );
                })}

}

// ─── Centros de Custo ─────────────────────────────────────────────────────────
function CentrosCusto({centros,setCentros,fretes,kpis,fmtBRL,fmtPct}){
  const [novoCC,setNovoCC]=useState({codigo:"",nome:"",filial:"",orcamento:""});
  const [abaCC,setAbaCC]=useState("visao"); // visao | cadastro | comparativo

  function adicionarCC(){
    if(!novoCC.codigo||!novoCC.nome||!novoCC.filial){alert("Preencha código, nome e filial.");return;}
    setCentros([...centros,{...novoCC,id:"cc"+Date.now(),orcamento:+novoCC.orcamento||0}]);
    setNovoCC({codigo:"",nome:"",filial:"",orcamento:""});
  }
  function removerCC(id){if(window.confirm("Remover este centro de custo?"))setCentros(centros.filter(c=>c.id!==id));}
  function atualizarOrc(id,val){setCentros(centros.map(c=>c.id===id?{...c,orcamento:+val}:c));}

  /* custo realizado por CC */
  const realizadoPorCC=useMemo(()=>{
    const m={};
    fretes.forEach(f=>(f.rateios||[]).forEach(r=>{const v=(f.valorFrete||0)*(r.pct/100);m[r.ccId]=(m[r.ccId]||0)+v;}));
    return m;
  },[fretes]);

  /* por CC por tipo */
  const ccPorTipo=useMemo(()=>{
    const m={};
    fretes.forEach(f=>(f.rateios||[]).forEach(r=>{
      if(!m[r.ccId])m[r.ccId]={};
      const v=(f.valorFrete||0)*(r.pct/100);
      m[r.ccId][r.tipoDespesa]=(m[r.ccId][r.tipoDespesa]||0)+v;
    }));
    return m;
  },[fretes]);

  /* filiais únicas */
  const filiaisUnicas=[...new Set(centros.map(c=>c.filial))];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* Sub-abas */}
      <div style={{display:"flex",gap:8}}>
        {[["visao","📊 Visão Geral"],["comparativo","📈 Comparativo"],["cadastro","⚙️ Gerenciar CCs"]].map(([id,label])=>(
          <button key={id} style={{...s.btnSecondary,background:abaCC===id?"#1e3a5f":"#1e293b",color:abaCC===id?"#93c5fd":"#94a3b8",border:abaCC===id?"1px solid #3b82f6":"1px solid #334155"}} onClick={()=>setAbaCC(id)}>{label}</button>
        ))}
      </div>

      {abaCC==="visao"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {filiaisUnicas.map(filial=>(
            <div key={filial} style={s.card}>
              <h3 style={{...s.cardTitle,marginBottom:12,color:"#93c5fd"}}>🏢 {filial}</h3>
              <table style={s.table}>
                <thead><tr>{["Código","Departamento","Orçamento","Realizado","Saldo","Utiliz.","Frete Compra","Frete Venda","Transferência","Devolução"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {centros.filter(c=>c.filial===filial).map(cc=>{
                    const real=realizadoPorCC[cc.id]||0;
                    const saldo=cc.orcamento-real;
                    const pct=cc.orcamento?real/cc.orcamento*100:0;
                    const ct=ccPorTipo[cc.id]||{};
                    return(
                      <tr key={cc.id} style={s.tr}>
                        <td style={{...s.td,color:"#94a3b8",fontSize:11}}>{cc.codigo}</td>
                        <td style={{...s.td,fontWeight:600,color:"#e2e8f0"}}>{cc.nome}</td>
                        <td style={s.td}>{fmtBRL(cc.orcamento)}</td>
                        <td style={{...s.td,fontWeight:600,color:pct>100?"#f87171":"#4ade80"}}>{fmtBRL(real)}</td>
                        <td style={{...s.td,color:saldo<0?"#ef4444":"#22c55e",fontWeight:600}}>{fmtBRL(saldo)}</td>
                        <td style={s.td}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div style={{...s.progressBar,width:60,flex:"none"}}><div style={{...s.progressFill,width:`${Math.min(100,pct)}%`,background:pct>100?"#ef4444":"#22c55e"}}/></div>
                            <span style={{fontSize:11,color:pct>100?"#f87171":"#94a3b8"}}>{pct.toFixed(0)}%</span>
                          </div>
                        </td>
                        {["frete_compra","frete_venda","transferencia","devolucao"].map(tid=>(
                          <td key={tid} style={{...s.td,color:tipoDespesaInfo(tid).cor,fontSize:12}}>{ct[tid]?fmtBRL(ct[tid]):"—"}</td>
                        ))}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ))}
        </div>
      )}

      {abaCC==="comparativo"&&(
        <div style={s.card}>
          <h3 style={s.cardTitle}>📈 Comparativo de Centros de Custo — Orçado vs Realizado</h3>
          <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:14}}>
            {centros.filter(c=>(realizadoPorCC[c.id]||0)>0||(c.orcamento||0)>0).sort((a,b)=>(realizadoPorCC[b.id]||0)-(realizadoPorCC[a.id]||0)).map(cc=>{
              const real=realizadoPorCC[cc.id]||0;
              const orc=cc.orcamento||0;
              const maxBar=Math.max(real,orc,1);
              const pct=orc?real/orc*100:0;
              return(
                <div key={cc.id} style={{padding:"10px 0",borderBottom:"1px solid #1e293b"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,alignItems:"center"}}>
                    <span style={{fontSize:13,color:"#e2e8f0"}}><span style={{color:"#64748b",marginRight:6,fontSize:11}}>{cc.codigo}</span>{cc.nome} <span style={{color:"#475569"}}>/ {cc.filial}</span></span>
                    <span style={{fontSize:12,color:pct>100?"#f87171":"#94a3b8"}}>{pct.toFixed(0)}% do orçamento</span>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:10,color:"#475569",width:50,textAlign:"right"}}>Orç.</span>
                    <div style={{...s.progressBar,flex:1}}><div style={{...s.progressFill,width:`${orc/maxBar*100}%`,background:"#334155"}}/></div>
                    <span style={{fontSize:11,color:"#64748b",width:80,textAlign:"right"}}>{fmtBRL(orc)}</span>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
                    <span style={{fontSize:10,color:"#475569",width:50,textAlign:"right"}}>Real</span>
                    <div style={{...s.progressBar,flex:1}}><div style={{...s.progressFill,width:`${real/maxBar*100}%`,background:pct>100?"#ef4444":"#22c55e"}}/></div>
                    <span style={{fontSize:11,fontWeight:600,color:pct>100?"#f87171":"#4ade80",width:80,textAlign:"right"}}>{fmtBRL(real)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {abaCC==="cadastro"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Novo CC */}
          <div style={{...s.card,borderTop:"3px solid #3b82f6"}}>
            <h3 style={s.cardTitle}>➕ Novo Centro de Custo</h3>
            <div style={{display:"grid",gridTemplateColumns:"1fr 2fr 2fr 1fr auto",gap:10,marginTop:12,alignItems:"end"}}>

function detectCol(headers, candidatos) {
  for (const cand of candidatos) {
    const idx = headers.findIndex(h => h && (String(h).toLowerCase().includes(cand.toLowerCase()) || cand.toLowerCase().includes(String(h).toLowerCase())));
    if (idx >= 0) return idx;
  }
  return -1;
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v.toISOString().slice(0,10);
  if (typeof v === 'number') {
    try {
      const d = new Date(Math.round((v-25569)*86400*1000));
      return d.toISOString().slice(0,10);
    } catch(e) { return null; }
  }
  const s = String(v).trim();
  if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.slice(0,10);
  return null;
}

function parseStatusExcel(v) {
  if (!v) return 'pendente';
  const s = String(v).toLowerCase().trim();
  if (s==='entregue'||s.includes('entrega realizada')||s.includes('realizada')||s.includes('antecipada')||s.includes('dentro do prazo')||s.includes('fora do prazo')) return 'entregue';
  if (s.includes('transit')||s.includes('andamento')||s.includes('expedido')||s.includes('faturado')) return 'em_transito';
  if (s.includes('cancel')||s.includes('devolu')||s.includes('insucesso')||s.includes('retorn')) return 'cancelado';
  return 'pendente';
}

function ImportarExcel({fretes, onImportar, centros, setCentros, fmtBRL}) {
  const [canal, setCanal] = useState("ecommerce");
  const [mesRef, setMesRef] = useState(new Date().toISOString().slice(0,7));
  const [etapa, setEtapa] = useState("upload");
  const [arquivo, setArquivo] = useState(null);
  const [preview, setPreview] = useState([]);
  const [kpis, setKpis] = useState(null);
  const [mapeamento, setMapeamento] = useState({});
  const [headers, setHeaders] = useState([]);
  const [dadosBrutos, setDadosBrutos] = useState([]);
  const [progresso, setProgresso] = useState(0);
  const [log, setLog] = useState([]);
  const [resultado, setResultado] = useState(null);
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef();

  React.useEffect(() => {
    if (etapa === "revisao" && dadosBrutos.length > 0 && headers.length > 0) {
      gerarPreview(mapeamento, dadosBrutos, canal);
    }
  }, [etapa]);

  const addLog = (msg, tipo="info") => setLog(prev => [...prev, {msg, tipo}]);

  function processarArquivo(file) {
    if (!file || !file.name.match(/\.xlsx?$/i)) { alert("Selecione um arquivo .xlsx ou .xls"); return; }
    setArquivo(file.name);
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});
        let melhorAba = wb.SheetNames[0];
        let maxRows = 0;
        wb.SheetNames.forEach(name => {
          const ws = wb.Sheets[name];
          if (!ws['!ref']) return;
          const range = XLSX.utils.decode_range(ws['!ref']);
          if (range.e.r > maxRows) { maxRows = range.e.r; melhorAba = name; }
        });
        const ws = wb.Sheets[melhorAba];
        const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
        let headerIdx = 0;
        let maxCols = 0;
        for (let i = 0; i < Math.min(10, json.length); i++) {
          const nonNull = json[i].filter(v=>v!=null&&v!==''&&typeof v==='string').length;
          if (nonNull > maxCols) { maxCols = nonNull; headerIdx = i; }
        }
        const hdrs = json[headerIdx].map((c,i) => c ? String(c).trim() : `Col_${i}`);
        const dados = json.slice(headerIdx+1).filter(r => r.some(v=>v!=null&&v!==''));
        setHeaders(hdrs);
        setDadosBrutos(dados);
        const cfg = CANAL_CONFIG[canal] || CANAL_CONFIG.ecommerce;
        const map = {};
        Object.keys(cfg.cols).forEach(k => { map[k] = detectCol(hdrs, cfg.cols[k]); });
        setMapeamento(map);
        addLog("✅ Arquivo lido: "+dados.length+" linhas, aba: "+melhorAba, "ok");
        // Auto-detect with current canal
        const canalAtual = document.querySelector('[id]') ? canal : "ecommerce";
        const cfgAtual = CANAL_CONFIG[canal] || CANAL_CONFIG.ecommerce;
        const mapAtual = {};
        Object.keys(cfgAtual.cols).forEach(k => { mapAtual[k] = detectCol(hdrs, cfgAtual.cols[k]); });
        setMapeamento(mapAtual);
        // Force preview generation after state updates
        setTimeout(() => {}, 0);
        setEtapa("revisao");
      } catch(err) { addLog("❌ Erro: "+err.message, "err"); }
    };
    reader.readAsBinaryString(file);
  }

  function gerarPreview(map, dados, canalAtual) {
    const cfg = CANAL_CONFIG[canalAtual] || CANAL_CONFIG.ecommerce;
    const g = map || mapeamento;
    const d = dados || dadosBrutos;
    const processed = d.map((row, i) => {
      const nf = g.nf >= 0 ? row[g.nf] : null;
      if (!nf) return null;
      const cidade = g.cidade >= 0 ? String(row[g.cidade]||'') : '';
      const uf = g.uf >= 0 ? String(row[g.uf]||'') : '';
      return {
        id: `fr_${String(nf).replace(/[^a-zA-Z0-9]/g,'_')}_${i}`.slice(0,50),
        nf: `NF-${nf}`,
        tipo: 'emitida',
        transportadora: g.transp>=0 ? String(row[g.transp]||'Não informada') : 'Não informada',
        modalidade: 'CIF',
        origem: g.origem>=0 ? String(row[g.origem]||'São Paulo, SP') : 'São Paulo, SP',
        destino: `${cidade}, ${uf}`.replace(/^,\s*/,''),
        valor_nf: parseFloat(g.vNF>=0?row[g.vNF]:0)||0,
        valor_frete: parseFloat(g.vFrete>=0?row[g.vFrete]:0)||0,
        peso: parseFloat(g.peso>=0?row[g.peso]:0)||0,
        prazo: parseDate(g.prazo>=0?row[g.prazo]:null),
        entrega: parseDate(g.entrega>=0?row[g.entrega]:null),
        status: parseStatusExcel(g.status>=0?row[g.status]:null),
        orcamento: 0, mes: mesRef,
        chave_cte: g.cte>=0&&row[g.cte] ? String(row[g.cte]) : null,
        cc_id: cfg.ccId, tipo_despesa: cfg.tipoDespesa,
      };
    }).filter(Boolean);
    const totalFrete = processed.reduce((a,r)=>a+r.valor_frete,0);
    const entregues = processed.filter(r=>r.status==='entregue').length;
    const transpSet = [...new Set(processed.map(r=>r.transportadora))];
    setKpis({total:processed.length, totalFrete, entregues, transpSet});
    setPreview(processed);
    return processed;
  }

  async function importar() {
    if (!preview.length) return;
    setEtapa("importando");
    setProgresso(0);
    const cfg = CANAL_CONFIG[canal] || CANAL_CONFIG.ecommerce;
    const CHUNK = 50;
    let ok = 0, erros = 0;

    // Garantir CC existe
    try {
      await sbInsert("centros_custo", {id:cfg.ccId, codigo:cfg.ccId.replace('cc_','').toUpperCase(), nome:cfg.label, filial:'Matriz SP', orcamento:0});
    } catch(e) {}

    for (let i = 0; i < preview.length; i += CHUNK) {
      const chunk = preview.slice(i, i+CHUNK);
      setProgresso(Math.round(i/preview.length*90));
      try {
        const fretes = chunk.map(r => ({
          id:r.id, nf:r.nf, chave_nfe:null, tipo:r.tipo,
          transportadora:r.transportadora, modalidade:r.modalidade,
          origem:r.origem, destino:r.destino,
          valor_nf:r.valor_nf, valor_frete:r.valor_frete, peso:r.peso,
          prazo:r.prazo, entrega:r.entrega, status:r.status,
          orcamento:r.orcamento, mes:r.mes, chave_cte:r.chave_cte
        }));
        const res = await fetch(SUPABASE_URL+"/rest/v1/fretes", {
          method:'POST',
          headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal,resolution=merge-duplicates'},
          body:JSON.stringify(fretes)
        });
        if (res.ok) {
          ok += chunk.length;
          const rateios = chunk.filter(r=>r.valor_frete>0).map(r=>({frete_id:r.id,cc_id:r.cc_id,pct:100,tipo_despesa:r.tipo_despesa}));
          if (rateios.length) await fetch(SUPABASE_URL+"/rest/v1/rateios",{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(rateios)});
          addLog("✅ "+ok+" registros importados","ok");
        } else { erros+=chunk.length; addLog("❌ Erro lote "+(Math.floor(i/CHUNK)+1),"err"); }
      } catch(err) { erros+=chunk.length; addLog("❌ "+err.message,"err"); }
    }
    setProgresso(100);
    setResultado({ok, erros});
    // Recarregar fretes do banco
    const fs = await sbGet("fretes");
    const rs = await sbGet("rateios");
    if (Array.isArray(fs)) {
      onImportar(fs.map(f=>({...f,valorNF:+f.valor_nf,valorFrete:+f.valor_frete,peso:+f.peso,orcamento:+f.orcamento,chaveNFe:f.chave_nfe,chaveCTe:f.chave_cte,rateios:Array.isArray(rs)?rs.filter(r=>r.frete_id===f.id).map(r=>({ccId:r.cc_id,pct:+r.pct,tipoDespesa:r.tipo_despesa})):[]})));
    }
    setEtapa("concluido");
  }

  if (etapa==="concluido") return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{...s.card,textAlign:"center",padding:40,borderTop:"3px solid #22c55e"}}>
        <div style={{fontSize:48}}>🎉</div>
        <h2 style={{color:"#22c55e",marginTop:12}}>Importação concluída!</h2>
        <p style={{color:"#94a3b8",marginTop:8}}><strong style={{color:"#4ade80"}}>{resultado?.ok}</strong> registros importados · <strong style={{color:"#f87171"}}>{resultado?.erros}</strong> erros</p>
        <p style={{color:"#475569",fontSize:12,marginTop:4}}>O dashboard já foi atualizado com os novos dados</p>
        <button style={{...s.btnSecondary,marginTop:16}} onClick={()=>{setEtapa("upload");setArquivo(null);setPreview([]);setLog([]);setKpis(null);}}>📂 Importar outro arquivo</button>
      </div>
      {log.length>0&&<div style={s.card}><div style={s.cardTitle}>📋 Log</div><div style={{marginTop:8,maxHeight:150,overflow:"auto",fontSize:11,fontFamily:"monospace"}}>{log.map((l,i)=><div key={i} style={{color:l.tipo==="ok"?"#22c55e":l.tipo==="err"?"#ef4444":"#64748b"}}>{l.msg}</div>)}</div></div>}
    </div>
  );

  if (etapa==="importando") return (
    <div style={s.card}>
      <div style={s.cardTitle}>⏳ Importando dados...</div>
      <div style={{...s.progressBar,marginTop:16}}><div style={{...s.progressFill,width:progresso+"%",background:"linear-gradient(90deg,#3b82f6,#22c55e)"}}/></div>

// ─── Simulador de Frete ───────────────────────────────────────────────────────
function SimuladorFrete({contratos, fmtBRL}) {
  const [peso, setPeso] = useState("1");
  const [uf, setUf] = useState("SP");
  const [valorNF, setValorNF] = useState("200");
  const [resultados, setResultados] = useState([]);

  const UFS_BR = ["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"];

  function simular() {
    const p = +peso;
    const vNF = +valorNF;
    const res = [];

    contratos.forEach(c => {
      if (!c.tabelas?.length) return;
      // Find region for UF
      const regiao = REGIOES_BR.find(r => r.ufs.includes(uf));
      if (!regiao) return;
      // Find matching faixa
      const faixa = c.tabelas.find(t => t.regiao === regiao.id && p >= +t.peso_ini && p <= +t.peso_fim);
      if (!faixa) return;
      // Calculate total
      const frete_base = Math.max(+faixa.valor, +faixa.minimo);
      const gris = vNF * (+faixa.gris / 100);
      const total = frete_base + gris + +faixa.coleta + +faixa.pedagio;
      res.push({
        transportadora: c.transportadora,
        modalidade: c.modalidade,
        regiao: regiao.label,
        frete_base, gris,
        coleta: +faixa.coleta,
        pedagio: +faixa.pedagio,
        total,
        prazo: faixa.prazo,
      });
    });

    setResultados(res.sort((a,b) => a.total - b.total));
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={s.card}>
        <div style={s.cardTitle}>🧮 Simulador de Frete — Compare transportadoras</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:12,marginTop:12,alignItems:"end"}}>
          <div><label style={s.label}>Peso (kg)</label><input style={s.input} type="number" step="0.1" value={peso} onChange={e=>setPeso(e.target.value)}/></div>
          <div><label style={s.label}>UF Destino</label>
            <select style={s.input} value={uf} onChange={e=>setUf(e.target.value)}>
              {UFS_BR.map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
          <div><label style={s.label}>Valor da NF (R$)</label><input style={s.input} type="number" value={valorNF} onChange={e=>setValorNF(e.target.value)}/></div>
          <button style={s.btnPrimary} onClick={simular}>Simular</button>
        </div>
      </div>

      {resultados.length>0&&(
        <div style={s.card}>
          <div style={s.cardTitle}>📊 Resultado da Simulação — {uf} · {peso}kg · NF {fmtBRL(+valorNF)}</div>
          <div style={{overflowX:"auto",marginTop:12}}>
            <table style={s.table}>
              <thead><tr>{["#","Transportadora","Modalidade","Frete Base","GRIS","Coleta","Pedágio","Total","Prazo"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
              <tbody>
                {resultados.map((r,i)=>(
                  <tr key={i} style={s.tr}>
                    <td style={{...s.td,color:i===0?"#fbbf24":"#64748b",fontWeight:700}}>#{i+1}</td>
                    <td style={{...s.td,fontWeight:600,color:i===0?"#4ade80":"#e2e8f0"}}>{r.transportadora}</td>
                    <td style={s.td}>{r.modalidade}</td>
                    <td style={s.td}>{fmtBRL(r.frete_base)}</td>
                    <td style={s.td}>{fmtBRL(r.gris)}</td>
                    <td style={s.td}>{fmtBRL(r.coleta)}</td>
                    <td style={s.td}>{fmtBRL(r.pedagio)}</td>
                    <td style={{...s.td,color:i===0?"#4ade80":"#f8fafc",fontWeight:700}}>{fmtBRL(r.total)}</td>
                    <td style={{...s.td,color:"#94a3b8"}}>{r.prazo}d úteis</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {resultados.length===0&&contratos.length===0&&(
        <div style={{...s.card,textAlign:"center",padding:30,color:"#475569",fontSize:13}}>
          Cadastre contratos com tabelas de frete para usar o simulador.
        </div>
      )}
    </div>
  );
}

function ResumoCard({icon,label,valor,cor}){return(<div style={{...s.card,borderTop:`3px solid ${cor}`,textAlign:"center"}}><div style={{fontSize:28}}>{icon}</div><div style={{fontSize:26,fontWeight:700,color:"#f8fafc",marginTop:4}}>{valor}</div><div style={{fontSize:11,color:"#64748b",marginTop:2}}>{label}</div></div>);}

// ─── Relatório Mensal ─────────────────────────────────────────────────────────
function Relatorio({fretes, centros, fmtBRL, fmtDate, fmtPct}) {
  const mesesUnicos = [...new Set(fretes.map(f=>f.mes))].sort().reverse();
  const [mesSel, setMesSel] = useState(mesesUnicos[0] || new Date().toISOString().slice(0,7));
  const [gerando, setGerando] = useState(false);

  const fretesMes = fretes.filter(f => f.mes === mesSel);

  /* KPIs do mês */
  const totalFrete = fretesMes.reduce((a,f)=>a+(f.valorFrete||0),0);
  const totalNF    = fretesMes.reduce((a,f)=>a+(f.valorNF||0),0);
  const totalPeso  = fretesMes.reduce((a,f)=>a+(f.peso||0),0);
  const entregues  = fretesMes.filter(f=>f.status==="entregue");
  const atrasados  = entregues.filter(f=>f.entrega&&f.prazo&&f.entrega>f.prazo);
  const ontime     = entregues.length ? ((entregues.length-atrasados.length)/entregues.length*100).toFixed(1) : "—";
  const acimOrc    = fretesMes.filter(f=>f.valorFrete>f.orcamento&&f.orcamento>0);
  const pctFrete   = totalNF ? (totalFrete/totalNF*100).toFixed(2) : 0;

  /* Por transportadora */
  const porTransp = {};
  fretesMes.forEach(f=>{
    if(!porTransp[f.transportadora]) porTransp[f.transportadora]={total:0,qtd:0,peso:0,atrasados:0,entregues:0};
    porTransp[f.transportadora].total += f.valorFrete||0;
    porTransp[f.transportadora].qtd   += 1;
    porTransp[f.transportadora].peso  += f.peso||0;
    if(f.status==="entregue") porTransp[f.transportadora].entregues += 1;
    if(f.entrega&&f.prazo&&f.entrega>f.prazo) porTransp[f.transportadora].atrasados += 1;
  });
  const transpEntries = Object.entries(porTransp).sort((a,b)=>b[1].total-a[1].total);

  /* Por centro de custo */
  const porCC = {};
  fretesMes.forEach(f=>(f.rateios||[]).forEach(r=>{
    if(!porCC[r.ccId]) porCC[r.ccId]={total:0,qtd:0};
    porCC[r.ccId].total += (f.valorFrete||0)*(r.pct/100);
    porCC[r.ccId].qtd   += 1;
  }));
  const ccEntries = Object.entries(porCC).sort((a,b)=>b[1].total-a[1].total);

  /* Por tipo despesa */
  const porTipo = {};
  fretesMes.forEach(f=>(f.rateios||[]).forEach(r=>{
    const v=(f.valorFrete||0)*(r.pct/100);
    porTipo[r.tipoDespesa]=(porTipo[r.tipoDespesa]||0)+v;
  }));

  const ccNome = id => { const c=centros.find(x=>x.id===id); return c?`${c.codigo} ${c.nome}/${c.filial}`:"—"; };
  const ccOrc  = id => { const c=centros.find(x=>x.id===id); return c?.orcamento||0; };

  /* ── Export Excel ──────────────────────────────────────────────── */
  function exportarExcel() {
    setGerando(true);
    try {
      const wb = XLSX.utils.book_new();

      /* Aba 1: Resumo */
      const resumo = [
        ["RELATÓRIO MENSAL DE FRETES — OÁZDM", ""],
        ["Mês de Referência:", mesSel],
        ["Gerado em:", new Date().toLocaleDateString("pt-BR")],
        [""],
        ["INDICADORES GERAIS"],
        ["Total de NFs/Fretes", fretesMes.length],
        ["Custo Total de Frete (R$)", totalFrete],
        ["Valor Total das NFs (R$)", totalNF],
        ["Peso Total (kg)", totalPeso],
        ["% Frete sobre NF", pctFrete+"%"],
        ["On-Time Delivery", ontime+"%"],
        ["Fretes acima do orçamento", acimOrc.length],
        [""],
        ["POR TIPO DE DESPESA"],
        ["Tipo", "Valor (R$)", "% do Total"],
        ...Object.entries(porTipo).map(([tid,val])=>[
          ({frete_compra:"Frete de Compra",frete_venda:"Frete de Venda",transferencia:"Transferência",devolucao:"Devolução"})[tid]||tid,
          val,
          totalFrete ? (val/totalFrete*100).toFixed(1)+"%" : "—"
        ]),
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), "Resumo");

      /* Aba 2: Fretes detalhados */
      const cabFretes = ["NF","Tipo","Transportadora","Modalidade","Origem","Destino","Valor NF","Valor Frete","Peso (kg)","% Frete","Prazo","Entrega Real","Status","Orçamento","Acima Orç?","CT-e"];
      const linhasFretes = fretesMes.map(f=>([
        f.nf, f.tipo, f.transportadora, f.modalidade,
        f.origem, f.destino,
        f.valorNF, f.valorFrete, f.peso,
        f.valorNF ? (f.valorFrete/f.valorNF*100).toFixed(2)+"%" : "—",
        f.prazo, f.entrega, f.status,
        f.orcamento,
        f.valorFrete>f.orcamento&&f.orcamento>0?"SIM":"—",
        f.chaveCTe||"—",
      ]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([cabFretes,...linhasFretes]), "Fretes Detalhados");

      /* Aba 3: Por Transportadora */
      const cabTransp = ["Transportadora","Qtd NFs","Custo Total (R$)","Peso Total (kg)","Custo Médio (R$)","Entregues","Atrasados","On-Time %"];
      const linhasTransp = transpEntries.map(([nome,d])=>([
        nome, d.qtd, d.total, d.peso,
        d.qtd ? (d.total/d.qtd).toFixed(2) : 0,
        d.entregues, d.atrasados,
        d.entregues ? ((d.entregues-d.atrasados)/d.entregues*100).toFixed(1)+"%" : "—"
      ]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([cabTransp,...linhasTransp]), "Por Transportadora");

      /* Aba 4: Por Centro de Custo */
      const cabCC = ["Centro de Custo","Custo Realizado (R$)","Orçamento (R$)","Saldo (R$)","% Utilizado","Qtd NFs"];
      const linhasCC = ccEntries.map(([id,d])=>([
        ccNome(id), d.total, ccOrc(id),
        ccOrc(id)-d.total,
        ccOrc(id) ? (d.total/ccOrc(id)*100).toFixed(1)+"%" : "—",
        d.qtd
      ]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([cabCC,...linhasCC]), "Centros de Custo");

      /* Aba 5: Rateio detalhado */
      const cabRateio = ["NF","Transportadora","Frete Total (R$)","Centro de Custo","% Rateio","Valor Rateado (R$)","Tipo Despesa"];
      const linhasRateio = [];
      fretesMes.forEach(f=>(f.rateios||[]).forEach(r=>{
        linhasRateio.push([
          f.nf, f.transportadora, f.valorFrete,
          ccNome(r.ccId), r.pct,
          (f.valorFrete*(r.pct/100)).toFixed(2),
          ({frete_compra:"Frete Compra",frete_venda:"Frete Venda",transferencia:"Transferência",devolucao:"Devolução"})[r.tipoDespesa]||r.tipoDespesa
        ]);
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([cabRateio,...linhasRateio]), "Rateio Detalhado");

      XLSX.writeFile(wb, `Torre de Controle_Oaz_${mesSel}.xlsx`);
    } catch(e) { alert("Erro ao gerar Excel: "+e.message); }
    setGerando(false);
  }

  /* ── Export CSV simples ──────────────────────────────────────────── */
  function exportarCSV() {
    const cab = ["NF","Transportadora","Valor Frete","Valor NF","Peso","Status","Prazo","Entrega","Centro de Custo","Tipo Despesa"];
    const linhas = fretesMes.map(f=>{
      const cc = (f.rateios||[]).map(r=>ccNome(r.ccId)).join("|");
      const tp = (f.rateios||[]).map(r=>r.tipoDespesa).join("|");
      return [f.nf,f.transportadora,f.valorFrete,f.valorNF,f.peso,f.status,f.prazo||"",f.entrega||"",cc,tp];
    });
    const csv = [cab,...linhas].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
    const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`Torre de Controle_Oaz_${mesSel}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  /* ── Print/PDF via janela de impressão ─────────────────────────── */
  function imprimirPDF() {
    const mesToPtBR = m => {
      const [ano,mes] = m.split("-");
      const nomes = ["","Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    };
    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<title>Relatório Torre de Controle – ${mesSel}</title>
<style>

  @media print{body{padding:12px;} .no-print{display:none;}}
</style></head><body>
<h1>📦 Torre de Controle — Oáz</h1>
<div class="sub">Relatório Mensal de Fretes · ${mesToPtBR(mesSel)} · Gerado em ${new Date().toLocaleDateString("pt-BR")}</div>

<div class="kpis">
  <div class="kpi"><div class="kpi-val">${fretesMes.length}</div><div class="kpi-label">Total de NFs</div></div>
  <div class="kpi"><div class="kpi-val">R$ ${totalFrete.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div><div class="kpi-label">Custo Total Frete</div></div>
  <div class="kpi"><div class="kpi-val">${ontime}%</div><div class="kpi-label">On-Time Delivery</div></div>

  <div class="kpi"><div class="kpi-val">${totalPeso.toLocaleString("pt-BR")} kg</div><div class="kpi-label">Peso Total</div></div>
  <div class="kpi"><div class="kpi-val">${acimOrc.length}</div><div class="kpi-label">Acima do Orçamento</div></div>
  <div class="kpi"><div class="kpi-val">${entregues.length}</div><div class="kpi-label">Entregues</div></div>
  <div class="kpi"><div class="kpi-val">${atrasados.length}</div><div class="kpi-label">Atrasados</div></div>
</div>

<h2>Por Transportadora</h2>
<table><thead><tr><th>Transportadora</th><th>Qtd NFs</th><th>Custo Total</th><th>Custo Médio</th><th>On-Time</th></tr></thead><tbody>
${transpEntries.map(([n,d])=>`<tr><td>${n}</td><td>${d.qtd}</td><td>R$ ${d.total.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>R$ ${d.qtd?(d.total/d.qtd).toLocaleString("pt-BR",{minimumFractionDigits:2}):"—"}</td><td>${d.entregues?((d.entregues-d.atrasados)/d.entregues*100).toFixed(1)+"%":"—"}</td></tr>`).join("")}
</tbody></table>

<h2>Por Centro de Custo</h2>
<table><thead><tr><th>Centro de Custo</th><th>Realizado</th><th>Orçamento</th><th>Saldo</th><th>% Utilizado</th></tr></thead><tbody>
${ccEntries.map(([id,d])=>{const orc=ccOrc(id);const saldo=orc-d.total;return`<tr><td>${ccNome(id)}</td><td>R$ ${d.total.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>R$ ${orc.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td class="${saldo<0?"badge-red":"badge-green"}">R$ ${saldo.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>${orc?(d.total/orc*100).toFixed(0)+"%":"—"}</td></tr>`;}).join("")}
</tbody></table>

<h2>Detalhamento de Fretes</h2>
<table><thead><tr><th>NF</th><th>Transportadora</th><th>Destino</th><th>Frete</th><th>Status</th><th>Prazo</th><th>Entrega</th></tr></thead><tbody>
${fretesMes.map(f=>`<tr><td>${f.nf}</td><td>${f.transportadora}</td><td>${f.destino||"—"}</td><td>R$ ${(f.valorFrete||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>${{entregue:"Entregue",em_transito:"Em Trânsito",pendente:"Pendente",cancelado:"Cancelado"}[f.status]||f.status}</td><td>${f.prazo||"—"}</td><td>${f.entrega||"—"}</td></tr>`).join("")}
</tbody></table>
<footer>Torre de Controle — Oáz Moda · Relatório gerado automaticamente · ${new Date().toLocaleString("pt-BR")}</footer>
</body></html>`;
    const win = window.open("","_blank","width=900,height=700");
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(()=>win.print(), 600);
  }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Cabeçalho de controles */}
      <div style={{...s.card,borderTop:"3px solid #8b5cf6"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div>
            <h3 style={{...s.cardTitle,color:"#c4b5fd",fontSize:14}}>📑 Relatório Mensal de Fretes</h3>
            <p style={{color:"#475569",fontSize:12,marginTop:4}}>Exporte em Excel (5 abas), CSV ou gere PDF para impressão</p>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div>
              <label style={s.label}>Mês de Referência</label>
              <select style={{...s.input,width:160}} value={mesSel} onChange={e=>setMesSel(e.target.value)}>
                {mesesUnicos.length===0&&<option value={mesSel}>{mesSel}</option>}
                {mesesUnicos.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <button style={{...s.btnSecondary,marginTop:16,display:"flex",alignItems:"center",gap:6}} onClick={exportarCSV}>
              📄 CSV
            </button>
            <button style={{...s.btnSecondary,marginTop:16,display:"flex",alignItems:"center",gap:6,color:"#4ade80",borderColor:"#166534"}} onClick={exportarExcel} disabled={gerando}>
              {gerando?"⏳ Gerando...":"📊 Excel (5 abas)"}
            </button>
            <button style={{...s.btnPrimary,marginTop:16,display:"flex",alignItems:"center",gap:6}} onClick={imprimirPDF}>
              🖨️ PDF / Imprimir
            </button>
          </div>
        </div>
      </div>

      {fretesMes.length===0?(
        <div style={{...s.card,textAlign:"center",padding:40}}>
          <div style={{fontSize:40}}>📭</div>
          <div style={{color:"#64748b",marginTop:12}}>Nenhum frete encontrado para {mesSel}</div>
          <div style={{color:"#475569",fontSize:12,marginTop:4}}>Selecione outro mês ou importe dados primeiro.</div>
        </div>
      ):(
        <>
          {/* KPIs do mês */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
            {[
              {icon:"📄",label:"Total de NFs",val:fretesMes.length,cor:"#3b82f6"},
              {icon:"💰",label:"Custo Total Frete",val:fmtBRL(totalFrete),cor:"#8b5cf6"},
              {icon:"✅",label:"On-Time Delivery",val:ontime+"%",cor:"#22c55e"},
              {icon:"📈",label:"% Frete s/ NF",val:pctFrete+"%",cor:"#f59e0b"},
              {icon:"⚖️",label:"Peso Total",val:`${totalPeso.toLocaleString("pt-BR")} kg`,cor:"#06b6d4"},
              {icon:"⚠️",label:"Acima do Orçamento",val:acimOrc.length,cor:"#ef4444"},
              {icon:"🚚",label:"Transportadoras",val:transpEntries.length,cor:"#a78bfa"},

                <tbody>
                  {fretesMes.map(f=>{
                    const atrasado=f.entrega&&f.prazo&&f.entrega>f.prazo;
                    const pct=f.valorNF?(f.valorFrete/f.valorNF*100).toFixed(2):"—";
                    return(
                      <tr key={f.id} style={s.tr}>
                        <td style={{...s.td,fontWeight:600,color:"#93c5fd"}}>{f.nf}</td>
